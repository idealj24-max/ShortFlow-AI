<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ShortFlow AI — Master Orchestrator v15</title>
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc; overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body class="p-3 pb-16 max-w-lg mx-auto flex flex-col min-h-screen">

  <!-- Header -->
  <header class="flex items-center justify-between py-3 mb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-pink-500/30">
        S
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-white leading-none">SHORTFLOW <span class="text-pink-400">AI</span></h1>
        <span class="text-[10px] text-pink-300 font-mono">ORCHESTRATEUR v15 (ANTI-QUOTA)</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleModal('history-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200">
        📚 Projets
      </button>
      <button onclick="toggleModal('api-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-pink-400">
        🔑
      </button>
    </div>
  </header>

  <!-- Status Bar -->
  <div id="status-bar" class="mb-3 px-3 py-2 rounded-xl bg-slate-900/90 border border-slate-800 text-[11px] font-mono text-pink-300 text-center">
    Prêt • Mode Anti-Quota Actif
  </div>

  <!-- Input Studio -->
  <div class="glass-panel rounded-2xl p-4 shadow-xl mb-3 space-y-3">
    <div>
      <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block mb-1.5">🎬 Sujet ou Scénario de Vidéo IA</label>
      <textarea id="topic-input" rows="3" placeholder="Ex: Cristiano Ronaldo tire un coup franc surpuissant en boule de feu..." 
        class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Format / Durée</label>
        <select id="duration-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="30s">⚡ Punchy (30 sec)</option>
          <option value="60s" selected>📖 Storytelling (60 sec)</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Moteur Vidéo IA</label>
        <select id="style-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="cinematic 8k photorealistic">✨ Cinématique HD (Sora / Runway)</option>
          <option value="cyberpunk neon futuristic 8k">🌆 Cyberpunk Néon</option>
          <option value="documentary industrial 8k">🏭 Documentaire Industriel / Mines</option>
        </select>
      </div>
    </div>

    <button onclick="generateOrchestratorPipeline()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-600 via-rose-600 to-amber-600 hover:from-pink-500 hover:to-amber-500 text-white font-bold text-xs shadow-lg shadow-pink-600/30 transition active:scale-95">
      🚀 Lancer le Pipeline de Génération IA
    </button>
  </div>

  <!-- Workspace Container -->
  <div id="results-container" class="hidden space-y-3 flex-1">
    
    <!-- Hook Principal -->
    <div class="glass-panel rounded-2xl p-3 border-pink-500/40">
      <span class="text-[10px] font-bold text-pink-400 uppercase tracking-widest block mb-1">💡 Hook Principal</span>
      <p id="hook-view" class="text-xs font-bold text-white italic"></p>
    </div>

    <!-- Scenes & Prompts List -->
    <div class="space-y-3" id="scenes-pipeline-view"></div>

    <!-- Export & Save Actions -->
    <div class="flex gap-2 pt-2">
      <button onclick="saveCurrentPipeline()" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200">
        💾 Sauvegarder Pipeline
      </button>
      <button onclick="exportPipelineJSON()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/30">
        📥 Exporter le Pack (.JSON)
      </button>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-md max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-white">📚 Projets Sauvegardés</h2>
        <button onclick="toggleModal('history-modal')" class="text-slate-400 text-xs">✕</button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="api-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-sm">
      <h2 class="text-base font-bold text-white mb-1">Clé API Gemini</h2>
      <p class="text-xs text-slate-400 mb-3">Entrez votre clé Google AI Studio.</p>
      <input type="password" id="gemini-key-input" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white mb-3 focus:outline-none focus:border-pink-500" />
      <div class="flex justify-end gap-2">
        <button onclick="toggleModal('api-modal')" class="px-3 py-2 rounded-lg bg-slate-800 text-xs text-slate-300">Fermer</button>
        <button onclick="saveApiKey()" class="px-4 py-2 rounded-lg bg-pink-600 text-xs font-bold text-white">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let currentPipeline = null;

    function toggleModal(id) {
      const m = document.getElementById(id);
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
      if (id === 'history-modal') renderHistory();
    }

    function saveApiKey() {
      const key = document.getElementById('gemini-key-input').value.trim();
      if (key) {
        localStorage.setItem('GEMINI_API_KEY', key);
        toggleModal('api-modal');
        document.getElementById('status-bar').innerText = "Clé API enregistrée ✓";
      }
    }

    async function generateOrchestratorPipeline() {
      const topic = document.getElementById('topic-input').value.trim();
      const duration = document.getElementById('duration-select').value;
      const style = document.getElementById('style-select').value;

      if (!topic) {
        alert("Entre ton sujet ou ton idée de vidéo !");
        return;
      }

      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        toggleModal('api-modal');
        return;
      }

      document.getElementById('status-bar').innerText = "🧠 Orchestration du pipeline en cours...";

      const prompt = `Tu es un réalisateur professionnel de films et de clips viraux générés par IA (style Sora, Runway Gen-3, Kling).
Sujet de l'utilisateur : "${topic}"
Durée : ${duration}
Ambiance visuelle globale : "${style}"

Tu dois structurer ce projet en un pipeline complet de 4 scènes pour générer des vidéos IA de très haute qualité.
Pour chaque scène, fournis :
1. "time": le minutage exact (ex: "0-5s", "5-20s", etc.)
2. "voiceover": le texte de la voix-off en français percutant et captivant.
3. "video_prompt": un prompt vidéo en anglais ultra-détaillé, cinématographique, décrivant les mouvements de caméra (tracking, fast zoom, drone shot), l'éclairage volumétrique, les détails hyper-réalistes, la texture et la résolution 8K.

Génère UNIQUEMENT un objet JSON valide (sans markdown \`\`\`json) avec cette structure exacte :
{
  "hook": "Phrase d'accroche choc pour capturer l'attention",
  "scenes": [
    {"time": "0-5s", "voiceover": "Texte voix-off scène 1", "video_prompt": "Detailed cinematic 8k English video prompt for scene 1"},
    {"time": "5-20s", "voiceover": "Texte voix-off scène 2", "video_prompt": "Detailed cinematic 8k English video prompt for scene 2"},
    {"time": "20-45s", "voiceover": "Texte voix-off scène 3", "video_prompt": "Detailed cinematic 8k English video prompt for scene 3"},
    {"time": "45-60s", "voiceover": "Texte voix-off scène 4", "video_prompt": "Detailed cinematic 8k English video prompt for scene 4"}
  ]
}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleanJson = rawText.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(cleanJson);

        currentPipeline = { topic, duration, style, date: new Date().toLocaleDateString(), ...parsed };
        renderPipelineUI();
        document.getElementById('status-bar').innerText = "✅ Pipeline vidéo IA orchestré avec succès !";
      } catch (e) {
        console.warn("Quota API atteint, bascule sur le générateur local anti-quota :", e);
        document.getElementById('status-bar').innerText = "⚡ Quota API atteint -> Activation du Générateur Local Intelligent !";
        
        currentPipeline = generateSmartLocalPipeline(topic, duration, style);
        renderPipelineUI();
      }
    }

    function generateSmartLocalPipeline(topic, duration, style) {
      const lower = topic.toLowerCase();
      let isFootball = lower.includes('ronaldo') || lower.includes('foot') || lower.includes('ballon') || lower.includes('but') || lower.includes('match');
      let isMining = lower.includes('camion') || lower.includes('mine') || lower.includes('pelleteuse') || lower.includes('grue');

      if (isFootball) {
        return {
          topic, duration, style, date: new Date().toLocaleDateString(),
          hook: "Le jour où Cristiano Ronaldo a littéralement détruit les lois de la physique...",
          scenes: [
            { time: "0-5s", voiceover: "À 40 mètres du but, la pression est au sommet.", video_prompt: "Cinematic low-angle shot of Cristiano Ronaldo standing over a soccer ball at night in a massive packed stadium, extreme close-up on intense eyes, rain droplets falling in slow motion, stadium floodlights creating brilliant lens flare, hyper-realistic, photorealistic, 8k resolution." },
            { time: "5-20s", voiceover: "Quatre pas en arrière. La respiration mythique. Tout le stade retient son souffle.", video_prompt: "Dynamic camera tracking motion behind Cristiano Ronaldo as he takes four steps back, stands with iconic wide posture, deep chest rise breath, background stadium crowd blurred with high depth of field, slow-motion cinematic sports documentary style." },
            { time: "20-45s", voiceover: "Et là... la frappe pure ! Une puissance surhumaine. Le ballon s'enflamme et déchire les filets !", video_prompt: "High energy cinematic action sequence, fast zoom shot of Ronaldo striking the ball with incredible power, ball instantly transforms into a blazing fiery meteor with orange flame trails, dynamic fast camera following projectile across 40 meters, fireball violently tears and burns through goal net, goalkeeper left completely shocked, explosive volumetric smoke and VFX fire effect, ultra-detailed 8k video." },
            { time: "45-60s", voiceover: "Ronaldo s'élance... SIUUU ! Le stade entre en éruption totale. Abonne-toi !", video_prompt: "Epic cinematic medium shot of Cristiano Ronaldo running to corner flag, performing iconic jump-spin SIUUU celebration, shockwave ember effect around him, thousands of stadium fans standing up jumping in total ecstasy, dynamic camera rotation, vivid cinematic colors, masterpiece lighting, outro style." }
          ]
        };
      } else if (isMining) {
        return {
          topic, duration, style, date: new Date().toLocaleDateString(),
          hook: "Au cœur d'un géant d'acier de plus de 300 tonnes dans le désert...",
          scenes: [
            { time: "0-5s", voiceover: "Sur les pistes poussiéreuses de la mine, le colosse se met en mouvement.", video_prompt: "Cinematic drone shot of a massive heavy haul mining truck driving through a gigantic open-pit iron ore mine, dramatic dust clouds kicked up by giant tires, blazing desert sun casting sharp shadows, industrial documentary style, 8k." },
            { time: "5-20s", voiceover: "Un convoi exceptionnel transporte une pelleteuse géante à travers les cratères.", video_prompt: "Low-angle tracking shot of a heavy lowboy trailer transporting a massive excavator, powerful diesel engine vibration, rugged red earth tracks, hyper-realistic metal reflections, cinematic industrial lighting." },
            { time: "20-45s", voiceover: "Virage serré au bord du précipice : la moindre erreur de trajectoire est fatale.", video_prompt: "Extreme close-up on giant rubber tires gripping cliff edges, steep rocky descent, camera shaking with raw industrial power, dramatic tension, photorealistic 8k video." },
            { time: "45-60s", voiceover: "Mission accomplie. Le titan est livré, prêt à creuser la terre. Abonne-toi !", video_prompt: "Epic wide cinematic shot of mining machinery deployed at sunset, golden hour light reflecting off steel structures, triumphant industrial workers cheering, cinematic outro, 8k resolution." }
          ]
        };
      } else {
        return {
          topic, duration, style, date: new Date().toLocaleDateString(),
          hook: "Voici l'histoire incroyable qui va redéfinir votre vision de ce sujet...",
          scenes: [
            { time: "0-5s", voiceover: "Introduction saisissante au cœur de l'action.", video_prompt: `Cinematic establishing shot of ${topic}, dramatic lighting, hyper-realistic, 8k resolution, volumetric atmosphere.` },
            { time: "5-20s", voiceover: "Le développement monte en puissance avec des détails saisissants.", video_prompt: `Dynamic camera movement showcasing the core mechanics of ${topic}, crisp textures, cinematic color grading, 8k.` },
            { time: "20-45s", voiceover: "Le point culminant de l'histoire, intense et spectaculaire.", video_prompt: `Climax action sequence for ${topic}, explosive visual effects, intense cinematic lighting, dramatic depth of field, 8k.` },
            { time: "45-60s", voiceover: "Conclusion mémorable. Abonne-toi pour ne rien rater !", video_prompt: `Epic cinematic closing shot for ${topic}, masterpiece lighting, gorgeous composition, outro style, 8k.` }
          ]
        };
      }
    }

    function renderPipelineUI() {
      document.getElementById('hook-view').innerText = `"${currentPipeline.hook}"`;
      document.getElementById('scenes-pipeline-view').innerHTML = currentPipeline.scenes.map((s, idx) => `
        <div class="glass-panel rounded-xl p-3 space-y-2 border-slate-800">
          <div class="flex justify-between items-center">
            <span class="text-pink-400 font-bold text-xs">Scène ${idx + 1} (${s.time})</span>
            <button onclick="copyPrompt(${idx})" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-pink-300 px-2 py-1 rounded border border-slate-700">
              📋 Copier Prompt IA
            </button>
          </div>
          <div>
            <span class="text-[10px] font-bold text-slate-400 uppercase block">Voix-Off :</span>
            <p class="text-xs text-slate-200">${s.voiceover}</p>
          </div>
          <div class="bg-black/50 p-2 rounded-lg border border-slate-800/80">
            <span class="text-[9px] font-bold text-amber-400 uppercase block mb-0.5">Prompt Vidéo (Anglais 8K) :</span>
            <p class="text-[11px] font-mono text-emerald-300 select-all">${s.video_prompt}</p>
          </div>
        </div>
      `).join('');

      document.getElementById('results-container').classList.remove('hidden');
    }

    function copyPrompt(idx) {
      if (!currentPipeline || !currentPipeline.scenes[idx]) return;
      const promptText = currentPipeline.scenes[idx].video_prompt;
      navigator.clipboard.writeText(promptText).then(() => {
        alert(`Prompt de la Scène ${idx + 1} copié dans le presse-papier !`);
      });
    }

    function saveCurrentPipeline() {
      if (!currentPipeline) return;
      let hist = JSON.parse(localStorage.getItem('SHORTFLOW_ORCHESTRATOR') || '[]');
      hist.unshift(currentPipeline);
      if (hist.length > 15) hist.pop();
      localStorage.setItem('SHORTFLOW_ORCHESTRATOR', JSON.stringify(hist));
      document.getElementById('status-bar').innerText = "💾 Pipeline sauvegardé dans les projets ✓";
    }

    function exportPipelineJSON() {
      if (!currentPipeline) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentPipeline, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `shortflow_pipeline_${Date.now()}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_ORCHESTRATOR') || '[]');
      if (hist.length === 0) {
        list.innerHTML = `<div class="text-slate-500 text-center py-4">Aucun projet sauvegardé.</div>`;
        return;
      }
      list.innerHTML = hist.map((item, idx) => `
        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
          <div class="truncate">
            <div class="text-white font-bold truncate">${item.topic}</div>
            <div class="text-[10px] text-slate-400">${item.duration} • ${item.date}</div>
          </div>
          <button onclick="loadPipeline(${idx})" class="px-2.5 py-1 rounded bg-pink-600 text-white font-bold text-[10px] shrink-0">Ouvrir</button>
        </div>
      `).join('');
    }

    function loadPipeline(idx) {
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_ORCHESTRATOR') || '[]');
      if (hist[idx]) {
        currentPipeline = hist[idx];
        document.getElementById('topic-input').value = hist[idx].topic;
        renderPipelineUI();
        toggleModal('history-modal');
      }
    }
  </script>
</body>
</html>
