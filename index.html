<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ShortFlow AI — Studio Matrix Engine</title>
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc; overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(236, 72, 153, 0.25);
    }
  </style>
</head>
<body class="p-3 pb-14 max-w-lg mx-auto flex flex-col min-h-screen">

  <!-- Header -->
  <header class="flex items-center justify-between py-3 mb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-pink-500/30">
        S
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-white leading-none">SHORTFLOW <span class="text-pink-400">AI</span></h1>
        <span class="text-[10px] text-pink-300 font-mono">MATRIX ENGINE (CODE PUR)</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleModal('history-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200">
        📚 Projets
      </button>
      <button onclick="toggleModal('api-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-pink-400">
        🔑
      </button>
    </div>
  </header>

  <!-- Status Bar -->
  <div id="status-bar" class="mb-3 px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-[11px] font-mono text-pink-300 text-center">
    Prêt • Moteur Matrix Prêt à Compiler
  </div>

  <!-- Input Studio -->
  <div class="glass-panel rounded-2xl p-3.5 shadow-xl mb-3 space-y-3">
    <div>
      <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block mb-1.5">🎬 Sujet ou Idée de Vidéo (Libre)</label>
      <textarea id="topic-input" rows="3" placeholder="Ex: Cristiano Ronaldo tire un coup franc surpuissant en boule de feu..." 
        class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Format / Durée</label>
        <select id="duration-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="30s">⚡ Punchy (30 sec)</option>
          <option value="45s" selected>🔥 Standard (45 sec)</option>
          <option value="60s">📖 Storytelling (60 sec)</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Style de Matrice Visuelle</label>
        <select id="theme-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="fire">🔥 Énergie & Feu (Sports / Action)</option>
          <option value="cyber">🌆 Cyberpunk Néon (Tech / Futur)</option>
          <option value="industrial">🏭 Industriel & Chantier (Métal / Mines)</option>
          <option value="space">🌌 Cosmos & Étoiles (Astronomie)</option>
        </select>
      </div>
    </div>

    <button onclick="generateMatrixProject()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-600 via-rose-600 to-amber-600 hover:from-pink-500 hover:to-amber-500 text-white font-bold text-xs shadow-lg shadow-pink-600/30 transition active:scale-95">
      ⚡ Compiler & Générer la Vidéo par Code
    </button>
  </div>

  <!-- Workspace Container -->
  <div id="results-container" class="hidden space-y-3 flex-1">
    
    <!-- Video Preview Canvas Card -->
    <div class="glass-panel rounded-2xl p-3 relative overflow-hidden flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-2">
        <h2 class="text-xs font-bold text-pink-400 uppercase tracking-wider">🎥 Rendu Matrix Live (9:16)</h2>
        <span id="render-progress" class="text-[10px] font-mono text-amber-400">Prêt</span>
      </div>
      
      <!-- Canvas Screen -->
      <div class="relative w-full max-w-[220px] aspect-[9/16] bg-black rounded-xl overflow-hidden border border-pink-500/40 shadow-2xl flex items-center justify-center">
        <canvas id="video-canvas" width="540" height="960" class="w-full h-full object-cover"></canvas>
      </div>

      <!-- Export Action Button -->
      <div class="flex gap-2 mt-3 w-full">
        <button onclick="startMatrixRecording()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/30">
          📥 Enregistrer & Télécharger (.WEBM)
        </button>
      </div>
    </div>

    <!-- Script Details -->
    <div class="glass-panel rounded-2xl p-3.5">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2">📜 Scénario Compilé par Code</h2>
      <div id="script-scenes-view" class="space-y-2 text-xs text-slate-200"></div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-md max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-white">📚 Projets Matrix</h2>
        <button onclick="toggleModal('history-modal')" class="text-slate-400 text-xs">✕</button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="api-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-sm">
      <h2 class="text-base font-bold text-white mb-1">Clé API Gemini</h2>
      <p class="text-xs text-slate-400 mb-3">Entrez votre clé Google AI Studio.</p>
      <input type="password" id="gemini-key-input" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white mb-3 focus:outline-none focus:border-pink-500" />
      <div class="flex justify-end gap-2">
        <button onclick="toggleModal('api-modal')" class="px-3 py-2 rounded-lg bg-slate-800 text-xs text-slate-300">Fermer</button>
        <button onclick="saveApiKey()" class="px-4 py-2 rounded-lg bg-pink-600 text-xs font-bold text-white">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let currentProject = null;
    const canvas = document.getElementById('video-canvas');
    const ctx = canvas.getContext('2d');
    let animFrameId = null;
    let globalTick = 0;

    function toggleModal(id) {
      const m = document.getElementById(id);
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
      if (id === 'history-modal') renderHistory();
    }

    function saveApiKey() {
      const key = document.getElementById('gemini-key-input').value.trim();
      if (key) {
        localStorage.setItem('GEMINI_API_KEY', key);
        toggleModal('api-modal');
        document.getElementById('status-bar').innerText = "Clé API enregistrée ✓";
      }
    }

    async function generateMatrixProject() {
      const topic = document.getElementById('topic-input').value.trim();
      const duration = document.getElementById('duration-select').value;
      const theme = document.getElementById('theme-select').value;

      if (!topic) {
        alert("Entre ton sujet !");
        return;
      }

      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        toggleModal('api-modal');
        return;
      }

      document.getElementById('status-bar').innerText = "⚡ Compilation du scénario par le réacteur Matrix...";

      const prompt = `Tu es le compilateur intelligent de ShortFlow AI Matrix Engine.
Sujet : "${topic}"
Durée : ${duration}

Génère UNIQUEMENT un objet JSON valide (sans aucun markdown \`\`\`json) avec cette structure exacte :
{
  "hook": "Accroche percutante",
  "scenes": [
    {"time": "0-25%", "title": "INTRODUCTION", "text": "Texte court de la scène 1"},
    {"time": "25-50%", "title": "DÉVELOPPEMENT", "text": "Texte de la scène 2"},
    {"time": "50-75%", "title": "CLIMAX", "text": "Texte du climax visuel"},
    {"time": "75-100%", "title": "CONCLUSION", "text": "Texte de fin et CTA"}
  ]
}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleanJson = rawText.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(cleanJson);

        currentProject = { topic, duration, theme, date: new Date().toLocaleDateString(), ...parsed };

        document.getElementById('results-container').classList.remove('hidden');
        document.getElementById('script-scenes-view').innerHTML = currentProject.scenes.map(s => `
          <div class="p-2 bg-slate-900 rounded-xl border border-slate-800">
            <span class="text-pink-400 font-bold">[${s.title}]</span> <span class="text-slate-200">${s.text}</span>
          </div>
        `).join('');

        startMatrixLoop(0);
        document.getElementById('status-bar').innerText = "✅ Moteur Matrix prêt et compilé !";
      } catch (e) {
        console.error(e);
        document.getElementById('status-bar').innerText = "❌ Erreur : " + e.message;
      }
    }

    function startMatrixLoop(sceneIdx) {
      if (!currentProject) return;
      cancelAnimationFrame(animFrameId);
      
      function loop() {
        globalTick++;
        drawMatrixFrame(sceneIdx, globalTick);
        animFrameId = requestAnimationFrame(loop);
      }
      loop();
    }

    function drawMatrixFrame(sceneIdx, tick) {
      if (!currentProject) return;
      const scene = currentProject.scenes[sceneIdx] || currentProject.scenes[0];
      const theme = currentProject.theme;

      // 1. Base Gradient Matrix
      let bgGrad = ctx.createLinearGradient(0, 0, 540, 960);
      if (theme === 'fire') {
        bgGrad.addColorStop(0, '#450a0a'); bgGrad.addColorStop(0.5, '#7c2d12'); bgGrad.addColorStop(1, '#9a3412');
      } else if (theme === 'cyber') {
        bgGrad.addColorStop(0, '#020617'); bgGrad.addColorStop(0.5, '#4c0519'); bgGrad.addColorStop(1, '#831843');
      } else if (theme === 'industrial') {
        bgGrad.addColorStop(0, '#1c1917'); bgGrad.addColorStop(0.5, '#292524'); bgGrad.addColorStop(1, '#44403c');
      } else {
        bgGrad.addColorStop(0, '#030712'); bgGrad.addColorStop(0.5, '#1e1b4b'); bgGrad.addColorStop(1, '#312e81');
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 540, 960);

      // 2. Procedural Code Animation (Dynamic Matrix Particles / Energy Waves)
      ctx.save();
      for (let i = 0; i < 35; i++) {
        let speed = (i % 3) + 1;
        let x = (i * 45 + Math.sin(tick * 0.03 + i) * 30) % 540;
        let y = (i * 35 + tick * speed * 1.5) % 960;
        let size = (i % 4) + 2;

        if (theme === 'fire') {
          ctx.fillStyle = i % 2 === 0 ? 'rgba(251, 191, 36, 0.6)' : 'rgba(239, 68, 68, 0.7)';
        } else if (theme === 'cyber') {
          ctx.fillStyle = i % 2 === 0 ? 'rgba(236, 72, 153, 0.6)' : 'rgba(56, 189, 248, 0.7)';
        } else {
          ctx.fillStyle = 'rgba(217, 119, 6, 0.5)';
        }

        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 3. Cinematic Vignette Overlay
      let vig = ctx.createRadialGradient(270, 480, 150, 270, 480, 600);
      vig.addColorStop(0, 'rgba(0,0,0,0.1)');
      vig.addColorStop(1, 'rgba(0,0,0,0.9)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, 540, 960);

      // 4. Title Badge
      ctx.fillStyle = 'rgba(236, 72, 153, 0.95)';
      ctx.roundRect(40, 80, 220, 45, 12);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(scene.title, 60, 110);

      // 5. Main Clean Text Rendered by Code
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px sans-serif';
      wrapText(ctx, scene.text, 40, 480, 460, 50);

      // 6. Footer Code Watermark
      ctx.fillStyle = '#f43f5e';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('⚡ SHORTFLOW MATRIX ENGINE', 40, 910);
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for(let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          context.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, y);
    }

    async function startMatrixRecording() {
      if (!currentProject) return;
      if (!window.MediaRecorder) {
        alert("Enregistrement non supporté.");
        return;
      }

      const statusEl = document.getElementById('render-progress');
      statusEl.innerText = "🔴 Compilation et enregistrement Matrix...";

      const stream = canvas.captureStream(30);
      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      } catch(e) {
        recorder = new MediaRecorder(stream);
      }

      let chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `shortflow_matrix_${Date.now()}.webm`;
        a.click();
        statusEl.innerText = "✅ Vidéo Matrix téléchargée avec succès !";
      };

      recorder.start();

      let currentScene = 0;
      const totalScenes = currentProject.scenes.length;
      const sceneDuration = 4500;

      startMatrixLoop(currentScene);

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const fullText = currentProject.scenes.map(s => s.text).join('. ');
        const utterance = new SpeechSynthesisUtterance(fullText);
        utterance.lang = 'fr-FR';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }

      const interval = setInterval(() => {
        currentScene++;
        if (currentScene < totalScenes) {
          startMatrixLoop(currentScene);
        } else {
          clearInterval(interval);
          setTimeout(() => {
            recorder.stop();
          }, sceneDuration);
        }
      }, sceneDuration);
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_MATRIX') || '[]');
      if (hist.length === 0) {
        list.innerHTML = `<div class="text-slate-500 text-center py-4">Aucun projet.</div>`;
        return;
      }
      list.innerHTML = hist.map((item, idx) => `
        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
          <div class="truncate">
            <div class="text-white font-bold truncate">${item.topic}</div>
            <div class="text-[10px] text-slate-400">${item.duration} • ${item.date}</div>
          </div>
          <button onclick="loadProj(${idx})" class="px-2.5 py-1 rounded bg-pink-600 text-white font-bold text-[10px] shrink-0">Ouvrir</button>
        </div>
      `).join('');
    }

    function loadProj(idx) {
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_MATRIX') || '[]');
      if (hist[idx]) {
        currentProject = hist[idx];
        document.getElementById('topic-input').value = hist[idx].topic;
        document.getElementById('results-container').classList.remove('hidden');
        startMatrixLoop(0);
        toggleModal('history-modal');
      }
    }
  </script>
</body>
</html>
