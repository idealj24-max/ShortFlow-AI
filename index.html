<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ShortFlow AI — Studio Vidéo IA Autonome</title>
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc; overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(236, 72, 153, 0.25);
    }
  </style>
</head>
<body class="p-3 pb-14 max-w-lg mx-auto flex flex-col min-h-screen">

  <!-- Header -->
  <header class="flex items-center justify-between py-3 mb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-pink-500/30">
        S
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-white leading-none">SHORTFLOW <span class="text-pink-400">AI</span></h1>
        <span class="text-[10px] text-pink-300 font-mono">ORCHESTRATEUR VIDÉO IA</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleModal('history-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200">
        📚 Projets
      </button>
      <button onclick="toggleModal('api-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-pink-400">
        🔑
      </button>
    </div>
  </header>

  <!-- Status Bar -->
  <div id="status-bar" class="mb-3 px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-[11px] font-mono text-pink-300 text-center">
    Prêt • Pipeline Vidéo IA Actif
  </div>

  <!-- Input Studio -->
  <div class="glass-panel rounded-2xl p-3.5 shadow-xl mb-3 space-y-3">
    <div>
      <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block mb-1.5">🎬 Prompt Scénaristique & Visuel IA</label>
      <textarea id="topic-input" rows="3" placeholder="Ex: Cristiano Ronaldo tire un coup franc surpuissant qui se transforme en boule de feu..." 
        class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Format / Durée</label>
        <select id="duration-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="30s">⚡ Punchy (30 sec)</option>
          <option value="45s" selected>🔥 Standard (45 sec)</option>
          <option value="60s">📖 Storytelling (60 sec)</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Moteur Vidéo IA</label>
        <select id="engine-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="cinematic">✨ Cinématique HD (Stable)</option>
          <option value="hyper">🚀 Hyper-Réaliste (Kling/Runway)</option>
          <option value="anime">🎨 Style Animation 3D</option>
        </select>
      </div>
    </div>

    <button onclick="generateVideoPipeline()" class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-bold text-xs shadow-lg shadow-pink-600/30 transition active:scale-95">
      🔮 Lancer le Pipeline de Génération IA
    </button>
  </div>

  <!-- Results Container -->
  <div id="results-container" class="hidden space-y-3 flex-1">
    
    <!-- Video Clips Prompts & Render Cards -->
    <div class="glass-panel rounded-2xl p-3.5">
      <h2 class="text-xs font-bold text-pink-400 uppercase tracking-wider mb-2">🎞️ Scènes & Prompts Vidéo IA Prêts</h2>
      <div id="scenes-container" class="space-y-3 text-xs text-slate-200"></div>
    </div>

    <!-- Action Footer -->
    <div class="grid grid-cols-2 gap-2 pt-1">
      <button onclick="saveProjectToHistory()" class="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-pink-400">
        💾 Sauvegarder Pipeline
      </button>
      <button onclick="exportFullPromptPackage()" class="py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white shadow-md">
        ⬇ Exporter le Pack (.JSON)
      </button>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-md max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-white">📚 Pipelines Sauvegardés</h2>
        <button onclick="toggleModal('history-modal')" class="text-slate-400 text-xs">✕</button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="api-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-sm">
      <h2 class="text-base font-bold text-white mb-1">Clé API Gemini</h2>
      <p class="text-xs text-slate-400 mb-3">Entrez votre clé Google AI Studio.</p>
      <input type="password" id="gemini-key-input" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white mb-3 focus:outline-none focus:border-pink-500" />
      <div class="flex justify-end gap-2">
        <button onclick="toggleModal('api-modal')" class="px-3 py-2 rounded-lg bg-slate-800 text-xs text-slate-300">Fermer</button>
        <button onclick="saveApiKey()" class="px-4 py-2 rounded-lg bg-pink-600 text-xs font-bold text-white">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let currentProject = null;

    function toggleModal(id) {
      const m = document.getElementById(id);
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
      if (id === 'history-modal') renderHistory();
    }

    function saveApiKey() {
      const key = document.getElementById('gemini-key-input').value.trim();
      if (key) {
        localStorage.setItem('GEMINI_API_KEY', key);
        toggleModal('api-modal');
        document.getElementById('status-bar').innerText = "Clé API enregistrée ✓";
      }
    }

    async function generateVideoPipeline() {
      const topic = document.getElementById('topic-input').value.trim();
      const duration = document.getElementById('duration-select').value;
      const engine = document.getElementById('engine-select').value;

      if (!topic) {
        alert("Entre ton prompt vidéo !");
        return;
      }

      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        toggleModal('api-modal');
        return;
      }

      document.getElementById('status-bar').innerText = "🔮 Orchestration des scènes et prompts vidéo par l'IA...";

      const prompt = `Tu es un réalisateur expert en IA générative vidéo (Runway, Kling, Sora).
Sujet principal : "${topic}"
Durée : ${duration}
Style Moteur : ${engine}

Génère UNIQUEMENT un objet JSON valide (sans markdown \`\`\`json) avec cette structure :
{
  "hook": "Phrase d'accroche virale",
  "scenes": [
    {
      "time": "0-3s",
      "script": "Voix off pour cette séquence",
      "video_prompt_en": "Cinematic 8k prompt in English optimized for video generation AI describing exact motion, lighting and camera angle",
      "b_roll": "Description visuelle du plan"
    },
    {
      "time": "3-15s",
      "script": "Voix off pour la suite",
      "video_prompt_en": "Detailed cinematic video generation prompt in English with dynamic camera movement",
      "b_roll": "Description du plan secondaire"
    },
    {
      "time": "15-45s",
      "script": "Voix off du climax",
      "video_prompt_en": "High energy cinematic video prompt in English showing peak action and visual effects",
      "b_roll": "Description de l'action principale"
    },
    {
      "time": "45-60s",
      "script": "Voix off de fin et appel à l'action",
      "video_prompt_en": "Professional outro cinematic video prompt in English",
      "b_roll": "Plan final marquant"
    }
  ]
}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleanJson = rawText.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(cleanJson);

        currentProject = { topic, duration, engine, date: new Date().toLocaleDateString(), ...parsed };
        displayPipelineResults(currentProject);
        document.getElementById('status-bar').innerText = "✅ Pipeline vidéo IA orchestré avec succès !";
      } catch (e) {
        console.error(e);
        document.getElementById('status-bar').innerText = "❌ Erreur : " + e.message;
      }
    }

    function displayPipelineResults(proj) {
      document.getElementById('results-container').classList.remove('hidden');
      const container = document.getElementById('scenes-container');
      
      container.innerHTML = `
        <div class="p-2.5 bg-slate-900 rounded-xl border border-slate-800">
          <span class="text-amber-400 font-bold">🪝 Hook Principal :</span> "${proj.hook}"
        </div>
      ` + proj.scenes.map((s, idx) => `
        <div class="p-2.5 bg-slate-900 rounded-xl border border-slate-800 space-y-2">
          <div class="flex justify-between items-center">
            <span class="px-1.5 py-0.5 rounded bg-pink-500/20 text-pink-400 font-mono text-[10px] font-bold">Scène ${idx + 1} (${s.time})</span>
            <button onclick="navigator.clipboard.writeText('${s.video_prompt_en.replace(/'/g, "\\'")}'); alert('Prompt vidéo copié !');" class="text-[10px] text-sky-400 underline font-mono">📋 Copier Prompt IA</button>
          </div>
          <div><strong class="text-slate-300">Voix-Off :</strong> <span class="text-slate-200">${s.script}</span></div>
          <div class="p-2 bg-black/50 rounded-lg border border-slate-800 font-mono text-[10px] text-emerald-400">
            <strong>Prompt Vidéo (Anglais) :</strong> ${s.video_prompt_en}
          </div>
        </div>
      `).join('');
    }

    function saveProjectToHistory() {
      if (!currentProject) return;
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_PIPELINES') || '[]');
      hist.unshift(currentProject);
      localStorage.setItem('SHORTFLOW_PIPELINES', JSON.stringify(hist));
      alert("Pipeline sauvegardé !");
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_PIPELINES') || '[]');
      if (hist.length === 0) {
        list.innerHTML = `<div class="text-slate-500 text-center py-4">Aucun pipeline.</div>`;
        return;
      }
      list.innerHTML = hist.map((item, idx) => `
        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
          <div class="truncate">
            <div class="text-white font-bold truncate">${item.topic}</div>
            <div class="text-[10px] text-slate-400">${item.duration} • ${item.date}</div>
          </div>
          <button onclick="loadPipeline(${idx})" class="px-2.5 py-1 rounded bg-pink-600 text-white font-bold text-[10px] shrink-0">Ouvrir</button>
        </div>
      `).join('');
    }

    function loadPipeline(idx) {
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_PIPELINES') || '[]');
      if (hist[idx]) {
        currentProject = hist[idx];
        document.getElementById('topic-input').value = hist[idx].topic;
        displayPipelineResults(currentProject);
        toggleModal('history-modal');
      }
    }

    function exportFullPromptPackage() {
      if (!currentProject) return;
      const blob = new Blob([JSON.stringify(currentProject, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `shortflow_ai_pipeline_${Date.now()}.json`;
      a.click();
    }
  </script>
</body>
</html>
