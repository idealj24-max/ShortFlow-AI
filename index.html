<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ShortFlow AI — Multi-Candidate v30</title>
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc; overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(236, 72, 153, 0.3);
    }
    @keyframes kenBurns {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.12) translate(-2%, -2%); }
      100% { transform: scale(1.05) translate(2%, 1%); }
    }
    .ken-burns {
      animation: kenBurns 12s ease-in-out infinite alternate;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="p-3 pb-16 max-w-lg mx-auto flex flex-col min-h-screen">

  <!-- Header -->
  <header class="flex items-center justify-between py-3 mb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-pink-500/30">
        S
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-white leading-none">SHORTFLOW <span class="text-pink-400">AI</span></h1>
        <span class="text-[10px] text-pink-300 font-mono">MULTI-CANDIDATE v30</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleModal('history-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200">
        📚 Projets
      </button>
      <button onclick="toggleModal('api-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-pink-400">
        🔑
      </button>
    </div>
  </header>

  <!-- Status Bar -->
  <div id="status-bar" class="mb-3 px-3 py-2 rounded-xl bg-slate-900/90 border border-slate-800 text-[11px] font-mono text-pink-300 text-center">
    Prêt • Moteur Multi-Variantes Actif
  </div>

  <!-- Input Studio -->
  <div class="glass-panel rounded-2xl p-4 shadow-xl mb-3 space-y-3">
    <div>
      <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block mb-1.5">🎬 Votre Scénario / Histoire</label>
      <textarea id="topic-input" rows="4" placeholder="Collez votre histoire détaillée ici..." 
        class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Format & Longueur</label>
        <select id="duration-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="4">⚡ Short Standard (4 Scènes)</option>
          <option value="8" selected>🎬 Mini-Série TikTok (8 Scènes)</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Style Visuel Cloud</label>
        <select id="style-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="cinematic 8k">✨ Cinématique Hollywood (8K)</option>
          <option value="cyberpunk 8k">🌆 Cyberpunk Néon</option>
          <option value="hyperrealistic">🔥 Hyperréaliste 3D FX</option>
        </select>
      </div>
    </div>

    <button onclick="generateMiniSeriesStudio()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-600 via-rose-600 to-amber-600 hover:from-pink-500 hover:to-amber-500 text-white font-bold text-xs shadow-lg shadow-pink-600/30 transition active:scale-95">
      🚀 Générer la Mini-Série & Multi-Variantes
    </button>
  </div>

  <!-- Workspace Container -->
  <div id="results-container" class="hidden space-y-3 flex-1">
    
    <!-- Video Preview Cinematic Card -->
    <div class="glass-panel rounded-2xl p-3 relative overflow-hidden flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-2">
        <h2 class="text-xs font-bold text-pink-400 uppercase tracking-wider">🎥 Lecteur Mini-Série Live (9:16)</h2>
        <span id="render-progress" class="text-[10px] font-mono text-amber-400">Prêt</span>
      </div>
      
      <!-- Screen container -->
      <div class="relative w-full max-w-[220px] aspect-[9/16] bg-slate-950 rounded-xl overflow-hidden border border-pink-500/40 shadow-2xl flex items-center justify-center">
        <img id="cinematic-screen-img" src="" alt="" class="absolute inset-0 w-full h-full object-cover ken-burns transition-opacity duration-500" crossorigin="anonymous" />
        
        <div id="img-loader-badge" class="hidden absolute top-2 right-2 px-2 py-0.5 rounded-full bg-black/70 border border-pink-500/40 text-[9px] font-mono text-pink-300 z-20">
          ⏳ Cloud...
        </div>

        <div class="absolute inset-x-0 bottom-0 p-3 bg-gradient-to-t from-black/95 via-black/70 to-transparent flex flex-col justify-end pointer-events-none z-10">
          <div id="scene-badge" class="self-start px-2 py-0.5 rounded bg-pink-600/90 text-white font-bold text-[9px] mb-1">SCÈNE 1</div>
          <p id="subtitle-view" class="text-xs font-bold text-white leading-snug drop-shadow"></p>
        </div>
      </div>

      <!-- Sélecteur de Variantes Visuelles pour la scène active (Anti-fatigue de clics) -->
      <div class="w-full flex items-center justify-center gap-2 mt-2 bg-slate-900/80 p-2 rounded-xl border border-slate-800">
        <span class="text-[10px] font-bold text-slate-400 uppercase">Variante :</span>
        <div id="variant-buttons" class="flex gap-1.5">
          <button onclick="switchVariant(0)" id="var-btn-0" class="px-2.5 py-1 rounded bg-pink-600 text-white font-bold text-[10px]">Var 1</button>
          <button onclick="switchVariant(1)" id="var-btn-1" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 font-bold text-[10px]">Var 2</button>
          <button onclick="switchVariant(2)" id="var-btn-2" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 font-bold text-[10px]">Var 3</button>
        </div>
        <button onclick="retryCurrentSceneImage()" class="ml-2 text-[10px] text-pink-300 hover:text-white underline font-mono">
          🔄 Relancer
        </button>
      </div>

      <!-- Timeline Bar -->
      <div class="w-full px-2 mt-2">
        <div id="timeline-switcher" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1 justify-start sm:justify-center"></div>
      </div>

      <!-- Export Action Button -->
      <div class="flex gap-2 mt-3 w-full">
        <button id="record-btn" onclick="startCinematicRecording()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/30">
          📥 Enregistrer & Télécharger (.WEBM)
        </button>
      </div>
    </div>

    <!-- Hook Principal -->
    <div class="glass-panel rounded-2xl p-3 border-pink-500/40">
      <span class="text-[10px] font-bold text-pink-400 uppercase tracking-widest block mb-1">💡 Hook Principal</span>
      <p id="hook-view" class="text-xs font-bold text-white italic"></p>
    </div>

    <!-- Scenes & Prompts List -->
    <div class="space-y-3" id="scenes-pipeline-view"></div>

    <!-- Export JSON & Save Actions -->
    <div class="flex gap-2 pt-2">
      <button onclick="saveCurrentPipeline()" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200">
        💾 Sauvegarder
      </button>
      <button onclick="exportPipelineJSON()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/30">
        📥 Pack (.JSON)
      </button>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-md max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-white">📚 Projets Sauvegardés</h2>
        <button onclick="toggleModal('history-modal')" class="text-slate-400 text-xs">✕</button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="api-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-sm">
      <h2 class="text-base font-bold text-white mb-1">Clé API Gemini</h2>
      <p class="text-xs text-slate-400 mb-3">Entrez votre clé Google AI Studio.</p>
      <input type="password" id="gemini-key-input" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white mb-3 focus:outline-none focus:border-pink-500" />
      <div class="flex justify-end gap-2">
        <button onclick="toggleModal('api-modal')" class="px-3 py-2 rounded-lg bg-slate-800 text-xs text-slate-300">Fermer</button>
        <button onclick="saveApiKey()" class="px-4 py-2 rounded-lg bg-pink-600 text-xs font-bold text-white">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let currentPipeline = null;
    let activeSceneIndex = 0;
    let activeVariantIndex = 0;
    let sceneImages = []; // Array of arrays: sceneImages[sceneIdx][variantIdx] = Image object
    let fallbackDataUrls = [];

    function toggleModal(id) {
      const m = document.getElementById(id);
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
      if (id === 'history-modal') renderHistory();
    }

    function saveApiKey() {
      const key = document.getElementById('gemini-key-input').value.trim();
      if (key) {
        localStorage.setItem('GEMINI_API_KEY', key);
        toggleModal('api-modal');
        document.getElementById('status-bar').innerText = "Clé API enregistrée ✓";
      }
    }

    function createLocalPosterDataUrl(sceneIndex, variantIndex = 0) {
      const c = document.createElement('canvas');
      c.width = 540;
      c.height = 960;
      const ctx = c.getContext('2d');

      const palettes = [
        ['#0f172a', '#831843', '#be185d'],
        ['#090d16', '#1e1b4b', '#4338ca'],
        ['#0f172a', '#064e3b', '#059669'],
        ['#18181b', '#7c2d12', '#ea580c']
      ];
      const pal = palettes[(sceneIndex + variantIndex) % palettes.length];
      const grad = ctx.createLinearGradient(0, 0, 540, 960);
      grad.addColorStop(0, pal[0]);
      grad.addColorStop(0.55, pal[1]);
      grad.addColorStop(1, pal[2]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 540, 960);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.beginPath();
      ctx.arc(270, 340, 180, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(236, 72, 153, 0.35)';
      ctx.lineWidth = 3;
      ctx.strokeRect(32, 32, 476, 896);

      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(`SHORTFLOW • S${sceneIndex + 1} (V${variantIndex + 1})`, 54, 110);

      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.font = 'bold 120px sans-serif';
      ctx.fillText(`0${sceneIndex + 1}`, 50, 260);

      return c.toDataURL('image/jpeg', 0.85);
    }

    async function generateMiniSeriesStudio() {
      const rawTopic = document.getElementById('topic-input').value.trim();
      const sceneCount = parseInt(document.getElementById('duration-select').value);
      const style = document.getElementById('style-select').value;

      if (!rawTopic) {
        alert("Entre ton scénario !");
        return;
      }

      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        toggleModal('api-modal');
        return;
      }

      document.getElementById('status-bar').innerText = `🧠 Analyse de l'histoire en ${sceneCount} scènes...`;

      const prompt = `Tu es un réalisateur de mini-séries TikTok.
Voici l'histoire fournie par l'auteur :
"""
${rawTopic}
"""
Découpe cette histoire en exactement ${sceneCount} scènes. Pour chaque scène, fournis :
1. "time": minutage (ex: "0-8s")
2. "voiceover": voix-off narrative en français (max 25 mots).
3. "video_prompt": prompt visuel 8K très détaillé en anglais.

Réponds UNIQUEMENT en JSON valide (sans aucun bloc markdown autour) :
{
  "hook": "Accroche choc",
  "scenes": [
    { "time": "0-8s", "voiceover": "...", "video_prompt": "..." }
  ]
}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleanJson = rawText.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(cleanJson);

        currentPipeline = { topic: rawTopic, sceneCount, style, date: new Date().toLocaleDateString(), ...parsed };
        await finishPipelineLoad();
      } catch (e) {
        console.warn("Mode intelligent de secours actif :", e);
        document.getElementById('status-bar').innerText = "⚡ Mode Intelligent Actif !";
        currentPipeline = generateSmartFallback(rawTopic, sceneCount, style);
        await finishPipelineLoad();
      }
    }

    function generateSmartFallback(topic, sceneCount, style) {
      const scenes = [];
      const sentences = topic.split('.').map(s => s.trim()).filter(s => s.length > 5);
      for (let i = 0; i < sceneCount; i++) {
        const partText = sentences[i % sentences.length] || topic.substring(0, 50);
        scenes.push({
          time: `${i*8}-${(i+1)*8}s`,
          voiceover: `Épisode ${i + 1} : ${partText}`,
          video_prompt: `Cinematic 8k shot, scene ${i + 1}, ${partText}, ${style}, dramatic lighting`
        });
      }
      return {
        topic, sceneCount, style, date: new Date().toLocaleDateString(),
        hook: `Saga : ${topic.substring(0, 45)}...`,
        scenes
      };
    }

    function getDirectImageUrl(promptText, index, variantIdx) {
      const shortPrompt = promptText.slice(0, 160);
      const encoded = encodeURIComponent(shortPrompt + ", vertical 9:16 aspect ratio, cinematic 8k");
      const seed = Math.floor(Math.random() * 90000) + index * 1337 + variantIdx * 99;
      const models = ['flux', 'turbo', 'flux-realism'];
      const model = models[(index + variantIdx) % models.length];
      return `https://image.pollinations.ai/prompt/${encoded}?width=540&height=960&model=${model}&nologo=true&seed=${seed}`;
    }

    async function loadSceneVariant(sceneIdx, variantIdx) {
      return new Promise(resolve => {
        if (!currentPipeline || !currentPipeline.scenes[sceneIdx]) return resolve(false);
        const img = new Image();
        img.crossOrigin = "anonymous";
        const url = getDirectImageUrl(currentPipeline.scenes[sceneIdx].video_prompt, sceneIdx, variantIdx);
        
        const timeout = setTimeout(() => { img.src = ""; resolve(false); }, 10000);

        img.onload = () => {
          clearTimeout(timeout);
          if (img.naturalWidth > 100) {
            sceneImages[sceneIdx][variantIdx] = img;
            if (activeSceneIndex === sceneIdx && activeVariantIndex === variantIdx) {
              document.getElementById('cinematic-screen-img').src = img.src;
              document.getElementById('img-loader-badge').classList.add('hidden');
            }
            resolve(true);
          } else { resolve(false); }
        };
        img.onerror = () => { clearTimeout(timeout); resolve(false); };
        img.src = url;
      });
    }

    async function finishPipelineLoad() {
      saveToHistory(currentPipeline);

      const count = currentPipeline.scenes.length;
      sceneImages = Array.from({length: count}, () => [null, null, null]);
      fallbackDataUrls = currentPipeline.scenes.map((_, idx) => [
        createLocalPosterDataUrl(idx, 0),
        createLocalPosterDataUrl(idx, 1),
        createLocalPosterDataUrl(idx, 2)
      ]);

      document.getElementById('hook-view').innerText = `"${currentPipeline.hook}"`;
      document.getElementById('scenes-pipeline-view').innerHTML = currentPipeline.scenes.map((s, idx) => `
        <div class="glass-panel rounded-xl p-3 space-y-2 border-slate-800">
          <div class="flex justify-between items-center">
            <span class="text-pink-400 font-bold text-xs">Scène ${idx + 1} (${s.time})</span>
            <button onclick="copyPrompt(${idx})" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-pink-300 px-2 py-1 rounded border border-slate-700">
              📋 Copier Prompt
            </button>
          </div>
          <div>
            <span class="text-[10px] font-bold text-slate-400 uppercase block">Voix-Off :</span>
            <p class="text-xs text-slate-200">${s.voiceover}</p>
          </div>
          <div class="bg-black/50 p-2 rounded-lg border border-slate-800/80">
            <span class="text-[9px] font-bold text-amber-400 uppercase block mb-0.5">Prompt Visuel :</span>
            <p class="text-[11px] font-mono text-emerald-300 select-all">${s.video_prompt}</p>
          </div>
        </div>
      `).join('');

      document.getElementById('timeline-switcher').innerHTML = currentPipeline.scenes.map((_, idx) => `
        <button id="pill-s-${idx}" onclick="previewScene(${idx})" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-[11px] font-bold shrink-0 transition active:scale-95">S${idx + 1}</button>
      `).join('');

      document.getElementById('results-container').classList.remove('hidden');
      previewScene(0);

      // Chargement automatique des 3 variantes pour chaque scène en arrière-plan (Zéro spam de clics)
      for (let i = 0; i < count; i++) {
        if (!navigator.onLine) break;
        document.getElementById('status-bar').innerText = `⏳ Génération multi-variantes scène ${i + 1}/${count}...`;
        for (let v = 0; v < 3; v++) {
          await loadSceneVariant(i, v);
          await new Promise(r => setTimeout(r, 600));
        }
      }

      document.getElementById('img-loader-badge').classList.add('hidden');
      document.getElementById('status-bar').innerText = "✅ Mini-Série prête ! 3 variantes par scène disponibles.";
    }

    async function previewScene(idx) {
      activeSceneIndex = idx;
      activeVariantIndex = 0;
      updateVariantUI();

      const sceneData = currentPipeline.scenes[idx] || currentPipeline.scenes[0];
      document.getElementById('scene-badge').innerText = `SCÈNE ${idx + 1}`;
      document.getElementById('subtitle-view').innerText = sceneData.voiceover;

      currentPipeline.scenes.forEach((_, i) => {
        const btn = document.getElementById(`pill-s-${i}`);
        if (btn) {
          if (i === idx) {
            btn.classList.add('bg-pink-600', 'border-pink-400', 'text-white', 'shadow-lg', 'shadow-pink-600/40');
            btn.classList.remove('bg-slate-800', 'border-slate-700');
          } else {
            btn.classList.remove('bg-pink-600', 'border-pink-400', 'text-white', 'shadow-lg', 'shadow-pink-600/40');
            btn.classList.add('bg-slate-800', 'border-slate-700');
          }
        }
      });

      renderActiveImage();
    }

    function switchVariant(vIdx) {
      activeVariantIndex = vIdx;
      updateVariantUI();
      renderActiveImage();
    }

    function updateVariantUI() {
      for (let i = 0; i < 3; i++) {
        const btn = document.getElementById(`var-btn-${i}`);
        if (btn) {
          if (i === activeVariantIndex) {
            btn.className = "px-2.5 py-1 rounded bg-pink-600 text-white font-bold text-[10px]";
          } else {
            btn.className = "px-2.5 py-1 rounded bg-slate-800 text-slate-300 font-bold text-[10px]";
          }
        }
      }
    }

    function renderActiveImage() {
      const imgEl = document.getElementById('cinematic-screen-img');
      const badge = document.getElementById('img-loader-badge');
      const imgObj = sceneImages[activeSceneIndex]?[activeVariantIndex];

      if (imgObj && imgObj.complete && imgObj.naturalWidth > 100) {
        imgEl.src = imgObj.src;
        badge.classList.add('hidden');
      } else {
        imgEl.src = fallbackDataUrls[activeSceneIndex][activeVariantIndex];
        badge.classList.remove('hidden');
        loadSceneVariant(activeSceneIndex, activeVariantIndex).then(() => {
          badge.classList.add('hidden');
        });
      }
    }

    async function retryCurrentSceneImage() {
      const badge = document.getElementById('img-loader-badge');
      badge.classList.remove('hidden');
      document.getElementById('status-bar').innerText = `🔄 Régénération variante ${activeVariantIndex + 1}...`;
      await loadSceneVariant(activeSceneIndex, activeVariantIndex);
      badge.classList.add('hidden');
      document.getElementById('status-bar').innerText = `✅ Variante mise à jour !`;
    }

    async function startCinematicRecording() {
      if (!currentPipeline) return;
      if (!window.MediaRecorder) {
        alert("Enregistrement non supporté.");
        return;
      }

      const btn = document.getElementById('record-btn');
      const statusEl = document.getElementById('render-progress');
      btn.disabled = true;
      btn.classList.add('opacity-50');
      statusEl.innerText = "🔴 Rendu vidéo (.WEBM)...";

      const canvas = document.createElement('canvas');
      canvas.width = 540;
      canvas.height = 960;
      const ctx = canvas.getContext('2d');
      const stream = canvas.captureStream(30);

      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      } catch (e) {
        recorder = new MediaRecorder(stream);
      }

      let chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `shortflow_v30_${Date.now()}.webm`;
        a.click();
        statusEl.innerText = "✅ Vidéo téléchargée avec succès !";
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      };

      const sceneCount = currentPipeline.scenes.length;
      const totalMs = (sceneCount * 8) * 1000;
      const sceneMs = totalMs / sceneCount;

      activeSceneIndex = 0;
      activeVariantIndex = 0;
      recorder.start();

      function speakScene(idx) {
        if ('speechSynthesis' in window && currentPipeline.scenes[idx]) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(currentPipeline.scenes[idx].voiceover);
          utter.lang = 'fr-FR';
          utter.rate = 1.05;
          window.speechSynthesis.speak(utter);
        }
      }

      speakScene(0);
      previewScene(0);

      let currentStep = 0;
      let frameInScene = 0;
      const totalFramesPerScene = (sceneMs / 1000) * 30;

      const renderInterval = setInterval(() => {
        // Utilise la variante active ou la variante 0 par défaut
        const img = (sceneImages[currentStep]?[activeVariantIndex] && sceneImages[currentStep][activeVariantIndex].complete && sceneImages[currentStep][activeVariantIndex].naturalWidth > 100)
          ? sceneImages[currentStep][activeVariantIndex]
          : (sceneImages[currentStep]?.[0] && sceneImages[currentStep][0].complete ? sceneImages[currentStep][0] : null);

        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 0, 540, 960);

        if (img && img.complete) {
          const scale = 1.0 + (frameInScene / totalFramesPerScene) * 0.1;
          const w = 540 * scale;
          const h = 960 * scale;
          const x = (540 - w) / 2;
          const y = (960 - h) / 2;
          ctx.drawImage(img, x, y, w, h);
        }

        ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
        ctx.fillRect(0, 780, 540, 180);

        ctx.fillStyle = "#ec4899";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText(`SCÈNE ${currentStep + 1}`, 36, 820);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 21px sans-serif";
        wrapCanvasText(ctx, currentPipeline.scenes[currentStep].voiceover, 36, 855, 468, 28);

        frameInScene++;
        if (frameInScene >= totalFramesPerScene) {
          frameInScene = 0;
          currentStep++;
          if (currentStep < sceneCount) {
            previewScene(currentStep);
            speakScene(currentStep);
          } else {
            clearInterval(renderInterval);
            setTimeout(() => { recorder.stop(); }, 500);
          }
        }
      }, 1000 / 30);
    }

    function wrapCanvasText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          context.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, y);
    }

    function copyPrompt(idx) {
      if (!currentPipeline || !currentPipeline.scenes[idx]) return;
      navigator.clipboard.writeText(currentPipeline.scenes[idx].video_prompt).then(() => {
        alert(`Prompt Scène ${idx + 1} copié !`);
      });
    }

    function saveToHistory(proj) {
      let hist = JSON.parse(localStorage.getItem('SHORTFLOW_SERIES') || '[]');
      hist.unshift(proj);
      if (hist.length > 15) hist.pop();
      localStorage.setItem('SHORTFLOW_SERIES', JSON.stringify(hist));
    }

    function saveCurrentPipeline() {
      if (!currentPipeline) return;
      saveToHistory(currentPipeline);
      document.getElementById('status-bar').innerText = "💾 Projet sauvegardé ✓";
    }

    function exportPipelineJSON() {
      if (!currentPipeline) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentPipeline, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `shortflow_v30_${Date.now()}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_SERIES') || '[]');
      if (hist.length === 0) {
        list.innerHTML = `<div class="text-slate-500 text-center py-4">Aucun projet.</div>`;
        return;
      }
      list.innerHTML = hist.map((item, idx) => `
        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
          <div class="truncate">
            <div class="text-white font-bold truncate">${item.topic}</div>
            <div class="text-[10px] text-slate-400">${item.sceneCount || 4} scènes • ${item.date}</div>
          </div>
          <button onclick="loadProj(${idx})" class="px-2.5 py-1 rounded bg-pink-600 text-white font-bold text-[10px] shrink-0">Ouvrir</button>
        </div>
      `).join('');
    }

    function loadProj(idx) {
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_SERIES') || '[]');
      if (hist[idx]) {
        currentPipeline = hist[idx];
        document.getElementById('topic-input').value = hist[idx].topic;
        finishPipelineLoad();
        toggleModal('history-modal');
      }
    }
  </script>
</body>
</html>
