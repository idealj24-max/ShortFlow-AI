<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ShortFlow AI — Studio Scripts & Storyboards Viraux</title>
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc; overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(236, 72, 153, 0.25);
    }
  </style>
</head>
<body class="p-3 pb-14 max-w-lg mx-auto flex flex-col min-h-screen">

  <!-- Header -->
  <header class="flex items-center justify-between py-3 mb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-pink-500/30">
        S
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-white leading-none">SHORTFLOW <span class="text-pink-400">AI</span></h1>
        <span class="text-[10px] text-pink-300 font-mono">STUDIO TIKTOK & SHORTS</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleModal('history-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200">
        📚 Scripts
      </button>
      <button onclick="toggleModal('api-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-pink-400">
        🔑
      </button>
    </div>
  </header>

  <!-- Status Bar -->
  <div id="status-bar" class="mb-3 px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-[11px] font-mono text-pink-300 text-center">
    Prêt • Gemini 3.6 Flash Actif
  </div>

  <!-- Input Studio -->
  <div class="glass-panel rounded-2xl p-3.5 shadow-xl mb-3 space-y-3">
    <div>
      <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block mb-1.5">🎬 Sujet ou Idée de Vidéo</label>
      <textarea id="topic-input" rows="2" placeholder="Ex: Comment j'ai codé 3 applications IA depuis mon téléphone..." 
        class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Format / Durée</label>
        <select id="duration-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="30s">⚡ Punchy (30 sec)</option>
          <option value="45s" selected>🔥 Standard (45 sec)</option>
          <option value="60s">📖 Storytelling (60 sec)</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Ton & Énergie</label>
        <select id="tone-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="dynamic">🚀 Dynamique & Direct</option>
          <option value="story">🎥 Cinématique / Suspense</option>
          <option value="expert">🧠 Éducatif / Autorité</option>
        </select>
      </div>
    </div>

    <button onclick="generateShortScript()" class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-bold text-xs shadow-lg shadow-pink-600/30 transition active:scale-95">
      ✨ Générer Script + Hooks + Storyboard
    </button>
  </div>

  <!-- Results Container -->
  <div id="results-container" class="hidden space-y-3 flex-1">
    
    <!-- Hooks Card -->
    <div class="glass-panel rounded-2xl p-3.5">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2">🪝 3 Hooks Anti-Scroll (0-3s)</h2>
      <ul id="hooks-list" class="space-y-2 text-xs text-slate-200"></ul>
    </div>

    <!-- Script Card -->
    <div class="glass-panel rounded-2xl p-3.5">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-xs font-bold text-pink-400 uppercase tracking-wider">🎙️ Script Voix-Off & Rythme</h2>
        <button onclick="copyFullOutput()" class="text-[11px] font-mono text-sky-400 hover:underline">📋 Copier tout</button>
      </div>
      <div id="script-content" class="space-y-2.5 text-xs text-slate-200 leading-relaxed"></div>
    </div>

    <!-- Storyboard Card -->
    <div class="glass-panel rounded-2xl p-3.5">
      <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">🎥 Découpage Visuel & B-Rolls</h2>
      <div id="storyboard-content" class="space-y-2 text-xs text-slate-300"></div>
    </div>

    <!-- Action Footer -->
    <div class="grid grid-cols-2 gap-2 pt-1">
      <button onclick="saveScriptToHistory()" class="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-pink-400">
        💾 Sauvegarder
      </button>
      <button onclick="downloadMarkdown()" class="py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white shadow-md">
        ⬇ Exporter (.MD)
      </button>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-md max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-white">📚 Mes Scripts Sauvegardés</h2>
        <button onclick="toggleModal('history-modal')" class="text-slate-400 text-xs">✕</button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="api-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-sm">
      <h2 class="text-base font-bold text-white mb-1">Clé API Gemini</h2>
      <p class="text-xs text-slate-400 mb-3">Entrez votre clé Google AI Studio pour activer le studio de création.</p>
      <input type="password" id="gemini-key-input" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white mb-3 focus:outline-none focus:border-pink-500" />
      <div class="flex justify-end gap-2">
        <button onclick="toggleModal('api-modal')" class="px-3 py-2 rounded-lg bg-slate-800 text-xs text-slate-300">Fermer</button>
        <button onclick="saveApiKey()" class="px-4 py-2 rounded-lg bg-pink-600 text-xs font-bold text-white">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let lastGeneratedData = null;

    function toggleModal(id) {
      const m = document.getElementById(id);
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
      if (id === 'history-modal') renderHistory();
    }

    function saveApiKey() {
      const key = document.getElementById('gemini-key-input').value.trim();
      if (key) {
        localStorage.setItem('GEMINI_API_KEY', key);
        toggleModal('api-modal');
        document.getElementById('status-bar').innerText = "Clé API enregistrée ✓";
      }
    }

    async function generateShortScript() {
      const topic = document.getElementById('topic-input').value.trim();
      const duration = document.getElementById('duration-select').value;
      const tone = document.getElementById('tone-select').value;

      if (!topic) {
        alert("Décris d'abord ton idée de vidéo !");
        return;
      }

      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        toggleModal('api-modal');
        return;
      }

      document.getElementById('status-bar').innerText = "⏳ Écriture du script viral et du storyboard...";

      const prompt = `Tu es un réalisateur et scénariste viral spécialisé sur TikTok, Reels et YouTube Shorts.
Sujet : "${topic}"
Durée cible : ${duration}
Ton : ${tone}

Génère UNIQUEMENT un objet JSON valide (sans markdown \`\`\`json) avec cette structure exacte :
{
  "hooks": ["Hook 1 ultra accrocheur", "Hook 2 basé sur la curiosité", "Hook 3 choc/contre-intuitif"],
  "script": [
    {"time": "0-3s", "text": "Texte exact à dire face caméra..."},
    {"time": "3-15s", "text": "Développement rapide et valeur..."},
    {"time": "15-35s", "text": "Preuve / Démonstration / Climax..."},
    {"time": "35-45s", "text": "Appel à l'action (CTA) percutant..."}
  ],
  "storyboard": [
    {"scene": "Scène 1 (0-3s)", "visual": "Description du plan caméra, mouvement et texte à l'écran"},
    {"scene": "Scène 2 (3-15s)", "visual": "Description du B-Roll ou démonstration écran"},
    {"scene": "Scène 3 (15-45s)", "visual": "Plan final dynamique"}
  ]
}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleanJson = rawText.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(cleanJson);

        lastGeneratedData = { topic, duration, date: new Date().toLocaleDateString(), ...parsed };
        displayResults(lastGeneratedData);
        document.getElementById('status-bar').innerText = "✅ Script & Storyboard générés avec succès !";
      } catch (e) {
        console.error(e);
        document.getElementById('status-bar').innerText = "❌ Erreur : " + e.message;
      }
    }

    function displayResults(data) {
      document.getElementById('results-container').classList.remove('hidden');

      const hooksEl = document.getElementById('hooks-list');
      hooksEl.innerHTML = data.hooks.map((h, i) => `
        <li class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800">
          <span class="text-amber-400 font-bold">#${i + 1} :</span> "${h}"
        </li>
      `).join('');

      const scriptEl = document.getElementById('script-content');
      scriptEl.innerHTML = data.script.map(s => `
        <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800">
          <span class="inline-block px-1.5 py-0.5 rounded bg-pink-500/20 text-pink-400 font-mono text-[10px] font-bold mb-1">${s.time}</span>
          <p class="text-slate-200">${s.text}</p>
        </div>
      `).join('');

      const sbEl = document.getElementById('storyboard-content');
      sbEl.innerHTML = data.storyboard.map(b => `
        <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800">
          <div class="text-emerald-400 font-bold text-[11px] mb-0.5">${b.scene}</div>
          <div class="text-slate-300">${b.visual}</div>
        </div>
      `).join('');
    }

    function formatAsText(data) {
      let out = `🎬 SHORTFLOW AI — ${data.topic.toUpperCase()} (${data.duration})\n\n`;
      out += `🪝 HOOKS :\n` + data.hooks.map((h, i) => `${i + 1}. ${h}`).join('\n') + `\n\n`;
      out += `🎙️ SCRIPT :\n` + data.script.map(s => `[${s.time}] ${s.text}`).join('\n\n') + `\n\n`;
      out += `🎥 STORYBOARD :\n` + data.storyboard.map(b => `- ${b.scene} : ${b.visual}`).join('\n');
      return out;
    }

    function copyFullOutput() {
      if (!lastGeneratedData) return;
      navigator.clipboard.writeText(formatAsText(lastGeneratedData));
      alert("Script complet copié dans le presse-papier !");
    }

    function downloadMarkdown() {
      if (!lastGeneratedData) return;
      const blob = new Blob([formatAsText(lastGeneratedData)], { type: 'text/markdown' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `shortflow_script_${Date.now()}.md`;
      link.click();
    }

    function saveScriptToHistory() {
      if (!lastGeneratedData) return;
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_HISTORY') || '[]');
      hist.unshift(lastGeneratedData);
      localStorage.setItem('SHORTFLOW_HISTORY', JSON.stringify(hist));
      alert("Script sauvegardé dans ta bibliothèque !");
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_HISTORY') || '[]');
      if (hist.length === 0) {
        list.innerHTML = `<div class="text-slate-500 text-center py-4">Aucun script sauvegardé.</div>`;
        return;
      }
      list.innerHTML = hist.map((item, idx) => `
        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
          <div class="truncate">
            <div class="text-white font-bold truncate">${item.topic}</div>
            <div class="text-[10px] text-slate-400">${item.duration} • ${item.date}</div>
          </div>
          <button onclick="loadHistoryItem(${idx})" class="px-2.5 py-1 rounded bg-pink-600 text-white font-bold text-[10px] shrink-0">Ouvrir</button>
        </div>
      `).join('');
    }

    function loadHistoryItem(idx) {
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_HISTORY') || '[]');
      if (hist[idx]) {
        lastGeneratedData = hist[idx];
        document.getElementById('topic-input').value = hist[idx].topic;
        displayResults(hist[idx]);
        toggleModal('history-modal');
      }
    }
  </script>
</body>
</html>
