<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ShortFlow AI — Ultimate Hybrid Studio v16</title>
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc; overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body class="p-3 pb-16 max-w-lg mx-auto flex flex-col min-h-screen">

  <!-- Header -->
  <header class="flex items-center justify-between py-3 mb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-pink-500/30">
        S
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-white leading-none">SHORTFLOW <span class="text-pink-400">AI</span></h1>
        <span class="text-[10px] text-pink-300 font-mono">HYBRID STUDIO v16 (RENDERER + PROMPTS)</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleModal('history-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200">
        📚 Projets
      </button>
      <button onclick="toggleModal('api-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-pink-400">
        🔑
      </button>
    </div>
  </header>

  <!-- Status Bar -->
  <div id="status-bar" class="mb-3 px-3 py-2 rounded-xl bg-slate-900/90 border border-slate-800 text-[11px] font-mono text-pink-300 text-center">
    Prêt • Studio Hybride Prêt à Générer
  </div>

  <!-- Input Studio -->
  <div class="glass-panel rounded-2xl p-4 shadow-xl mb-3 space-y-3">
    <div>
      <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block mb-1.5">🎬 Sujet ou Scénario de Vidéo IA</label>
      <textarea id="topic-input" rows="3" placeholder="Ex: Cristiano Ronaldo tire un coup franc surpuissant en boule de feu..." 
        class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Format / Durée</label>
        <select id="duration-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="30">⚡ Punchy (30 sec)</option>
          <option value="60" selected>📖 Storytelling (60 sec)</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Moteur Vidéo IA</label>
        <select id="style-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="cinematic 8k">✨ Cinématique HD (Sora / Runway)</option>
          <option value="cyberpunk 8k">🌆 Cyberpunk Néon</option>
          <option value="industrial 8k">🏭 Documentaire Industriel / Mines</option>
        </select>
      </div>
    </div>

    <button onclick="generateHybridStudio()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-600 via-rose-600 to-amber-600 hover:from-pink-500 hover:to-amber-500 text-white font-bold text-xs shadow-lg shadow-pink-600/30 transition active:scale-95">
      🚀 Lancer la Génération Hybride (Rendu & Prompts)
    </button>
  </div>

  <!-- Workspace Container -->
  <div id="results-container" class="hidden space-y-3 flex-1">
    
    <!-- Video Preview Canvas Card -->
    <div class="glass-panel rounded-2xl p-3 relative overflow-hidden flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-2">
        <h2 class="text-xs font-bold text-pink-400 uppercase tracking-wider">🎥 Rendu Vidéo Live (9:16)</h2>
        <span id="render-progress" class="text-[10px] font-mono text-amber-400">En lecture</span>
      </div>
      
      <!-- Canvas Screen -->
      <div class="relative w-full max-w-[220px] aspect-[9/16] bg-black rounded-xl overflow-hidden border border-pink-500/40 shadow-2xl flex items-center justify-center">
        <canvas id="video-canvas" width="540" height="960" class="w-full h-full object-cover"></canvas>
      </div>

      <!-- Scene Switcher for Preview -->
      <div class="flex gap-1.5 mt-2.5 w-full justify-center">
        <button onclick="previewScene(0)" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-pink-600 text-[10px] font-bold">Scène 1</button>
        <button onclick="previewScene(1)" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-pink-600 text-[10px] font-bold">Scène 2</button>
        <button onclick="previewScene(2)" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-pink-600 text-[10px] font-bold">Scène 3</button>
        <button onclick="previewScene(3)" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-pink-600 text-[10px] font-bold">Scène 4</button>
      </div>

      <!-- Export Action Button -->
      <div class="flex gap-2 mt-3 w-full">
        <button id="record-btn" onclick="startVideoRecording()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/30">
          📥 Enregistrer & Télécharger la Vidéo (.WEBM)
        </button>
      </div>
    </div>

    <!-- Hook Principal -->
    <div class="glass-panel rounded-2xl p-3 border-pink-500/40">
      <span class="text-[10px] font-bold text-pink-400 uppercase tracking-widest block mb-1">💡 Hook Principal</span>
      <p id="hook-view" class="text-xs font-bold text-white italic"></p>
    </div>

    <!-- Scenes & Prompts List -->
    <div class="space-y-3" id="scenes-pipeline-view"></div>

    <!-- Export JSON & Save Actions -->
    <div class="flex gap-2 pt-2">
      <button onclick="saveCurrentPipeline()" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200">
        💾 Sauvegarder Projet
      </button>
      <button onclick="exportPipelineJSON()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/30">
        📥 Exporter Pack (.JSON)
      </button>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-md max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-white">📚 Projets Sauvegardés</h2>
        <button onclick="toggleModal('history-modal')" class="text-slate-400 text-xs">✕</button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="api-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-sm">
      <h2 class="text-base font-bold text-white mb-1">Clé API Gemini</h2>
      <p class="text-xs text-slate-400 mb-3">Entrez votre clé Google AI Studio.</p>
      <input type="password" id="gemini-key-input" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white mb-3 focus:outline-none focus:border-pink-500" />
      <div class="flex justify-end gap-2">
        <button onclick="toggleModal('api-modal')" class="px-3 py-2 rounded-lg bg-slate-800 text-xs text-slate-300">Fermer</button>
        <button onclick="saveApiKey()" class="px-4 py-2 rounded-lg bg-pink-600 text-xs font-bold text-white">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let currentPipeline = null;
    let compiledDrawFns = [];
    const canvas = document.getElementById('video-canvas');
    const ctx = canvas.getContext('2d');
    let animFrameId = null;
    let activeSceneIndex = 0;
    let sceneStartTime = 0;

    function toggleModal(id) {
      const m = document.getElementById(id);
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
      if (id === 'history-modal') renderHistory();
    }

    function saveApiKey() {
      const key = document.getElementById('gemini-key-input').value.trim();
      if (key) {
        localStorage.setItem('GEMINI_API_KEY', key);
        toggleModal('api-modal');
        document.getElementById('status-bar').innerText = "Clé API enregistrée ✓";
      }
    }

    async function generateHybridStudio() {
      const topic = document.getElementById('topic-input').value.trim();
      const totalSeconds = parseInt(document.getElementById('duration-select').value);
      const style = document.getElementById('style-select').value;

      if (!topic) {
        alert("Entre ton sujet ou ton idée de vidéo !");
        return;
      }

      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        toggleModal('api-modal');
        return;
      }

      document.getElementById('status-bar').innerText = "🧠 Génération du pipeline et des animations vectorielles...";

      const prompt = `Tu es un réalisateur professionnel de vidéos IA (style Sora, Runway) et un ingénieur graphique Canvas 2D.
Sujet : "${topic}"
Durée : ${totalSeconds}s
Style : "${style}"

Génère un pipeline de 4 scènes. Pour chaque scène, fournis :
1. "time": minutage (ex: "0-15s")
2. "voiceover": texte voix-off percutant en français.
3. "video_prompt": prompt vidéo 8K détaillé en anglais pour Sora/Runway.
4. "draw_code": code JavaScript pur (exécuté avec ctx, W=540, H=960, t en secondes, p de 0.0 à 1.0) qui dessine et anime graphiquement le sujet de la scène.

Génère UNIQUEMENT un objet JSON valide (sans markdown) avec cette structure :
{
  "hook": "Phrase d'accroche choc",
  "scenes": [
    {"time": "0-15s", "voiceover": "...", "video_prompt": "...", "draw_code": "ctx.fillStyle='#1e1b4b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(W/2,H*0.4,40+Math.sin(t*4)*20,0,Math.PI*2);ctx.fill();"},
    {"time": "15-30s", "voiceover": "...", "video_prompt": "...", "draw_code": "ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ef4444';ctx.fillRect(W/2 - 80, H*0.35 + Math.sin(t*6)*30, 160, 100);"},
    {"time": "30-45s", "voiceover": "...", "video_prompt": "...", "draw_code": "ctx.fillStyle='#450a0a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#38bdf8';ctx.lineWidth=5;ctx.beginPath();ctx.arc(W/2,H*0.45,70+p*50,0,Math.PI*2);ctx.stroke();"},
    {"time": "45-60s", "voiceover": "...", "video_prompt": "...", "draw_code": "ctx.fillStyle='#065f46';ctx.fillRect(0,0,W,H);ctx.fillStyle='#34d399';ctx.fillRect(50,H*0.35,W-100,160);"}
  ]
}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleanJson = rawText.replace(/```json|```/g, '').trim();
        currentPipeline = { topic, totalSeconds, style, date: new Date().toLocaleDateString(), ...JSON.parse(cleanJson) };
        finishPipelineLoad();
      } catch (e) {
        console.warn("Quota atteint -> Bascule sur le générateur local intelligent anti-quota :", e);
        document.getElementById('status-bar').innerText = "⚡ Quota API atteint -> Activation du Moteur Local Intelligent !";
        currentPipeline = generateSmartLocalHybrid(topic, totalSeconds, style);
        finishPipelineLoad();
      }
    }

    function generateSmartLocalHybrid(topic, totalSeconds, style) {
      const lower = topic.toLowerCase();
      let isFootball = lower.includes('ronaldo') || lower.includes('foot') || lower.includes('ballon') || lower.includes('but');
      let isMining = lower.includes('camion') || lower.includes('mine') || lower.includes('pelleteuse');

      if (isFootball) {
        return {
          topic, totalSeconds, style, date: new Date().toLocaleDateString(),
          hook: "Le jour où Cristiano Ronaldo a littéralement détruit les lois de la physique...",
          scenes: [
            { time: "0-15s", voiceover: "À 40 mètres du but, la pression est au sommet.", video_prompt: "Cinematic low-angle shot of Cristiano Ronaldo standing over a soccer ball at night, 8k.", draw_code: "ctx.fillStyle='#047857';ctx.fillRect(0,0,W,H);ctx.fillStyle='#065f46';for(let i=0;i<H;i+=60){ctx.fillRect(0,i,W,30);}ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(W/2,H*0.45,35+Math.sin(t*5)*5,0,Math.PI*2);ctx.fill();" },
            { time: "15-30s", voiceover: "Quatre pas en arrière. La respiration mythique.", video_prompt: "Dynamic camera tracking motion behind Cristiano Ronaldo, cinematic sports documentary style.", draw_code: "let g=ctx.createRadialGradient(W/2,H*0.4,10,W/2,H*0.4,250);g.addColorStop(0,'#f59e0b');g.addColorStop(1,'#1e1b4b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(W/2 + Math.sin(t*10)*80, H*0.4 - t*20, 25 + (p*15), 0, Math.PI*2);ctx.fill();" },
            { time: "30-45s", voiceover: "La frappe pure ! Une puissance surhumaine. Le ballon s'enflamme !", video_prompt: "High energy cinematic action, fiery meteor ball tearing through goal net, 8k video.", draw_code: "ctx.fillStyle='#111827';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ef4444';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W/2-100,H*0.3);ctx.lineTo(W/2+100,H*0.3);ctx.lineTo(W/2,H*0.6);ctx.closePath();ctx.stroke();ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(W/2,H*0.45,60*Math.sin(p*Math.PI),0,Math.PI*2);ctx.fill();" },
            { time: "45-60s", voiceover: "Ronaldo s'élance... SIUUU ! Le stade en délire ! Abonne-toi !", video_prompt: "Epic cinematic shot of Ronaldo performing SIUUU celebration, stadium cheering, 8k.", draw_code: "let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7c2d12');g.addColorStop(1,'#111827');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fbbf24';for(let i=0;i<40;i++){ctx.fillRect((i*73)%W,(i*91 + t*100)%H,6,6);}" }
          ]
        };
      } else {
        return {
          topic, totalSeconds, style, date: new Date().toLocaleDateString(),
          hook: "Voici l'histoire incroyable qui va captiver tous les regards...",
          scenes: [
            { time: "0-15s", voiceover: "Introduction saisissante au cœur de l'action.", video_prompt: "Cinematic establishing shot, hyper-realistic, 8k resolution.", draw_code: "let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1e1b4b');g.addColorStop(1,'#311026');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ec4899';ctx.beginPath();ctx.arc(W/2,H*0.4,50+Math.sin(t*4)*15,0,Math.PI*2);ctx.fill();" },
            { time: "15-30s", voiceover: "Le développement monte en puissance.", video_prompt: "Dynamic camera movement showcasing core mechanics, cinematic color grading, 8k.", draw_code: "let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0f172a');g.addColorStop(1,'#0284c7');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#38bdf8';ctx.lineWidth=6;ctx.beginPath();ctx.arc(W/2,H*0.45,80+p*40,0,Math.PI*2);ctx.stroke();" },
            { time: "30-45s", voiceover: "Le point culminant spectaculaire.", video_prompt: "Climax action sequence, explosive visual effects, dramatic depth of field, 8k.", draw_code: "let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#7f1d1d');g.addColorStop(1,'#450a0a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fbbf24';ctx.fillRect(W/2 - 90, H*0.35 + Math.sin(t*8)*20, 180, 120);" },
            { time: "45-60s", voiceover: "Conclusion mémorable. Abonne-toi !", video_prompt: "Epic cinematic closing shot, masterpiece lighting, outro style, 8k.", draw_code: "let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#065f46');g.addColorStop(1,'#064e3b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#34d399';ctx.fillRect(60,H*0.35,W-120,150);" }
          ]
        };
      }
    }

    function finishPipelineLoad() {
      compileSceneFunctions(currentPipeline);
      saveToHistory(currentPipeline);

      document.getElementById('hook-view').innerText = `"${currentPipeline.hook}"`;
      document.getElementById('scenes-pipeline-view').innerHTML = currentPipeline.scenes.map((s, idx) => `
        <div class="glass-panel rounded-xl p-3 space-y-2 border-slate-800">
          <div class="flex justify-between items-center">
            <span class="text-pink-400 font-bold text-xs">Scène ${idx + 1} (${s.time})</span>
            <button onclick="copyPrompt(${idx})" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-pink-300 px-2 py-1 rounded border border-slate-700">
              📋 Copier Prompt IA
            </button>
          </div>
          <div>
            <span class="text-[10px] font-bold text-slate-400 uppercase block">Voix-Off :</span>
            <p class="text-xs text-slate-200">${s.voiceover}</p>
          </div>
          <div class="bg-black/50 p-2 rounded-lg border border-slate-800/80">
            <span class="text-[9px] font-bold text-amber-400 uppercase block mb-0.5">Prompt Vidéo (Anglais 8K) :</span>
            <p class="text-[11px] font-mono text-emerald-300 select-all">${s.video_prompt}</p>
          </div>
        </div>
      `).join('');

      document.getElementById('results-container').classList.remove('hidden');
      previewScene(0);
      document.getElementById('status-bar').innerText = "✅ Studio Hybride prêt : Rendu Live & Prompts 8K actifs !";
    }

    function compileSceneFunctions(project) {
      compiledDrawFns = project.scenes.map((scene) => {
        try {
          return new Function('ctx', 'W', 'H', 't', 'p', scene.draw_code);
        } catch (err) {
          return null;
        }
      });
    }

    function previewScene(idx) {
      activeSceneIndex = idx;
      sceneStartTime = performance.now();
      if (!animFrameId) {
        renderLoop();
      }
    }

    function renderLoop() {
      if (!currentPipeline) return;
      const now = performance.now();
      const totalSec = currentPipeline.totalSeconds || 60;
      const sceneDurationSec = totalSec / 4;
      const t = (now - sceneStartTime) / 1000;
      const p = Math.min(1, (t % sceneDurationSec) / sceneDurationSec);

      const W = 540;
      const H = 960;
      const scene = currentPipeline.scenes[activeSceneIndex] || currentPipeline.scenes[0];
      const drawFn = compiledDrawFns[activeSceneIndex];

      ctx.save();
      ctx.clearRect(0, 0, W, H);
      if (drawFn) {
        try {
          drawFn(ctx, W, H, t, p);
        } catch (e) {
          ctx.fillStyle = '#1e1b4b'; ctx.fillRect(0,0,W,H);
        }
      } else {
        ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,W,H);
      }
      ctx.restore();

      // Dégradé bas pour lisibilité des sous-titres
      let bottomGrad = ctx.createLinearGradient(0, H * 0.58, 0, H);
      bottomGrad.addColorStop(0, 'rgba(0,0,0,0)');
      bottomGrad.addColorStop(0.45, 'rgba(0,0,0,0.75)');
      bottomGrad.addColorStop(1, 'rgba(0,0,0,0.95)');
      ctx.fillStyle = bottomGrad;
      ctx.fillRect(0, H * 0.58, W, H * 0.42);

      // Badge Scène
      ctx.fillStyle = 'rgba(236, 72, 153, 0.9)';
      ctx.beginPath();
      ctx.roundRect(32, 48, 260, 40, 10);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 17px sans-serif';
      ctx.fillText(`SCÈNE ${activeSceneIndex + 1}`, 48, 74);

      // Sous-titre Voix-Off
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px sans-serif';
      wrapText(ctx, scene.voiceover, 36, 690, 468, 38);

      // Barre de progression
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(36, 915, 468, 6);
      ctx.fillStyle = '#ec4899';
      ctx.fillRect(36, 915, 468 * p, 6);

      animFrameId = requestAnimationFrame(renderLoop);
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          context.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, y);
    }

    async function startVideoRecording() {
      if (!currentPipeline) return;
      if (!window.MediaRecorder) {
        alert("Enregistrement non supporté sur ce navigateur.");
        return;
      }

      const btn = document.getElementById('record-btn');
      const statusEl = document.getElementById('render-progress');
      btn.disabled = true;
      btn.classList.add('opacity-50');
      statusEl.innerText = "🔴 Enregistrement de la vidéo (.WEBM)...";

      const stream = canvas.captureStream(30);
      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      } catch (e) {
        recorder = new MediaRecorder(stream);
      }

      let chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `shortflow_master_${Date.now()}.webm`;
        a.click();
        statusEl.innerText = "✅ Vidéo téléchargée avec succès !";
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      };

      const totalMs = (currentPipeline.totalSeconds || 60) * 1000;
      const sceneMs = totalMs / 4;

      activeSceneIndex = 0;
      sceneStartTime = performance.now();
      recorder.start();

      function speakScene(idx) {
        if ('speechSynthesis' in window && currentPipeline.scenes[idx]) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(currentPipeline.scenes[idx].voiceover);
          utter.lang = 'fr-FR';
          utter.rate = 1.05;
          window.speechSynthesis.speak(utter);
        }
      }

      speakScene(0);

      let step = 0;
      const timer = setInterval(() => {
        step++;
        if (step < 4) {
          activeSceneIndex = step;
          sceneStartTime = performance.now();
          speakScene(step);
        } else {
          clearInterval(timer);
          setTimeout(() => { recorder.stop(); }, 1000);
        }
      }, sceneMs);
    }

    function copyPrompt(idx) {
      if (!currentPipeline || !currentPipeline.scenes[idx]) return;
      navigator.clipboard.writeText(currentPipeline.scenes[idx].video_prompt).then(() => {
        alert(`Prompt de la Scène ${idx + 1} copié !`);
      });
    }

    function saveToHistory(proj) {
      let hist = JSON.parse(localStorage.getItem('SHORTFLOW_HYBRID') || '[]');
      hist.unshift(proj);
      if (hist.length > 15) hist.pop();
      localStorage.setItem('SHORTFLOW_HYBRID', JSON.stringify(hist));
    }

    function saveCurrentPipeline() {
      if (!currentPipeline) return;
      saveToHistory(currentPipeline);
      document.getElementById('status-bar').innerText = "💾 Projet sauvegardé dans les favoris ✓";
    }

    function exportPipelineJSON() {
      if (!currentPipeline) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentPipeline, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `shortflow_hybrid_${Date.now()}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_HYBRID') || '[]');
      if (hist.length === 0) {
        list.innerHTML = `<div class="text-slate-500 text-center py-4">Aucun projet sauvegardé.</div>`;
        return;
      }
      list.innerHTML = hist.map((item, idx) => `
        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
          <div class="truncate">
            <div class="text-white font-bold truncate">${item.topic}</div>
            <div class="text-[10px] text-slate-400">${item.totalSeconds}s • ${item.date}</div>
          </div>
          <button onclick="loadProj(${idx})" class="px-2.5 py-1 rounded bg-pink-600 text-white font-bold text-[10px] shrink-0">Ouvrir</button>
        </div>
      `).join('');
    }

    function loadProj(idx) {
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_HYBRID') || '[]');
      if (hist[idx]) {
        currentPipeline = hist[idx];
        document.getElementById('topic-input').value = hist[idx].topic;
        finishPipelineLoad();
        toggleModal('history-modal');
      }
    }
  </script>
</body>
</html>
