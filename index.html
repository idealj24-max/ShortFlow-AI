<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ShortFlow AI — WebGL & Smart Prompts v18</title>
  <meta name="theme-color" content="#090d16" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js pour le rendu 3D WebGL autonome -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc; overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body class="p-3 pb-16 max-w-lg mx-auto flex flex-col min-h-screen">

  <!-- Header -->
  <header class="flex items-center justify-between py-3 mb-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-pink-500/30">
        S
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wide text-white leading-none">SHORTFLOW <span class="text-pink-400">AI</span></h1>
        <span class="text-[10px] text-pink-300 font-mono">WEBGL & SMART PROMPTS v18</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleModal('history-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200">
        📚 Projets
      </button>
      <button onclick="toggleModal('api-modal')" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-pink-400">
        🔑
      </button>
    </div>
  </header>

  <!-- Status Bar -->
  <div id="status-bar" class="mb-3 px-3 py-2 rounded-xl bg-slate-900/90 border border-slate-800 text-[11px] font-mono text-pink-300 text-center">
    Prêt • Analyseur Sémantique 3D & 8K Actif
  </div>

  <!-- Input Studio -->
  <div class="glass-panel rounded-2xl p-4 shadow-xl mb-3 space-y-3">
    <div>
      <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block mb-1.5">🎬 Sujet ou Scénario de Vidéo IA</label>
      <textarea id="topic-input" rows="3" placeholder="Ex: Cristiano Ronaldo tire un coup franc surpuissant en boule de feu..." 
        class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-pink-500 resize-none"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Format / Durée</label>
        <select id="duration-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="30">⚡ Punchy (30 sec)</option>
          <option value="60" selected>📖 Storytelling (60 sec)</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Moteur 3D & Style</label>
        <select id="style-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="cinematic 3d">✨ 3D Cinématique (Sora / Runway)</option>
          <option value="cyberpunk 3d">🌆 3D Cyberpunk Néon</option>
          <option value="industrial 3d">🏭 3D Industriel / Mines</option>
        </select>
      </div>
    </div>

    <button onclick="generateMasterStudio()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-600 via-rose-600 to-amber-600 hover:from-pink-500 hover:to-amber-500 text-white font-bold text-xs shadow-lg shadow-pink-600/30 transition active:scale-95">
      🚀 Générer le Rendu 3D & les Prompts Sur-Mesure
    </button>
  </div>

  <!-- Workspace Container -->
  <div id="results-container" class="hidden space-y-3 flex-1">
    
    <!-- Video Preview WebGL 3D Card -->
    <div class="glass-panel rounded-2xl p-3 relative overflow-hidden flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-2">
        <h2 class="text-xs font-bold text-pink-400 uppercase tracking-wider">🎥 Rendu 3D WebGL Live (9:16)</h2>
        <span id="render-progress" class="text-[10px] font-mono text-amber-400">En lecture 3D</span>
      </div>
      
      <!-- Canvas 3D Screen -->
      <div class="relative w-full max-w-[220px] aspect-[9/16] bg-black rounded-xl overflow-hidden border border-pink-500/40 shadow-2xl flex items-center justify-center">
        <canvas id="webgl-canvas" class="w-full h-full object-cover"></canvas>
        
        <!-- Overlay Subtitles -->
        <div class="absolute inset-x-0 bottom-0 p-3 bg-gradient-to-t from-black/95 via-black/70 to-transparent flex flex-col justify-end pointer-events-none">
          <div id="scene-badge" class="self-start px-2 py-0.5 rounded bg-pink-600/90 text-white font-bold text-[9px] mb-1">SCÈNE 1</div>
          <p id="subtitle-view" class="text-xs font-bold text-white leading-snug drop-shadow"></p>
        </div>
      </div>

      <!-- Scene Switcher for Preview -->
      <div class="flex gap-1.5 mt-2.5 w-full justify-center">
        <button onclick="previewScene(0)" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-pink-600 text-[10px] font-bold">Scène 1</button>
        <button onclick="previewScene(1)" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-pink-600 text-[10px] font-bold">Scène 2</button>
        <button onclick="previewScene(2)" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-pink-600 text-[10px] font-bold">Scène 3</button>
        <button onclick="previewScene(3)" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-pink-600 text-[10px] font-bold">Scène 4</button>
      </div>

      <!-- Export Action Button -->
      <div class="flex gap-2 mt-3 w-full">
        <button id="record-btn" onclick="startVideoRecording()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/30">
          📥 Enregistrer & Télécharger la Vidéo (.WEBM)
        </button>
      </div>
    </div>

    <!-- Hook Principal -->
    <div class="glass-panel rounded-2xl p-3 border-pink-500/40">
      <span class="text-[10px] font-bold text-pink-400 uppercase tracking-widest block mb-1">💡 Hook Principal</span>
      <p id="hook-view" class="text-xs font-bold text-white italic"></p>
    </div>

    <!-- Scenes & Prompts List -->
    <div class="space-y-3" id="scenes-pipeline-view"></div>

    <!-- Export JSON & Save Actions -->
    <div class="flex gap-2 pt-2">
      <button onclick="saveCurrentPipeline()" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200">
        💾 Sauvegarder Projet
      </button>
      <button onclick="exportPipelineJSON()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/30">
        📥 Exporter Pack (.JSON)
      </button>
    </div>
  </div>

  <!-- History Modal -->
  <div id="history-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-md max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-white">📚 Projets Sauvegardés</h2>
        <button onclick="toggleModal('history-modal')" class="text-slate-400 text-xs">✕</button>
      </div>
      <div id="history-list" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="api-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-5 w-full max-w-sm">
      <h2 class="text-base font-bold text-white mb-1">Clé API Gemini</h2>
      <p class="text-xs text-slate-400 mb-3">Entrez votre clé Google AI Studio.</p>
      <input type="password" id="gemini-key-input" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white mb-3 focus:outline-none focus:border-pink-500" />
      <div class="flex justify-end gap-2">
        <button onclick="toggleModal('api-modal')" class="px-3 py-2 rounded-lg bg-slate-800 text-xs text-slate-300">Fermer</button>
        <button onclick="saveApiKey()" class="px-4 py-2 rounded-lg bg-pink-600 text-xs font-bold text-white">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let currentPipeline = null;
    let scene3DObjects = [];
    let activeSceneIndex = 0;
    let sceneStartTime = 0;
    let animFrameId = null;

    // Three.js Setup Global
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(540, 960);
    renderer.setPixelRatio(window.devicePixelRatio > 1 ? 2 : 1);

    const scene3D = new THREE.Scene();
    scene3D.background = new THREE.Color(0x050814);

    const camera = new THREE.PerspectiveCamera(60, 540 / 960, 0.1, 1000);
    camera.position.set(0, 2, 8);
    camera.lookAt(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene3D.add(ambientLight);

    const pointLight = new THREE.PointLight(0xff3366, 3, 50);
    pointLight.position.set(0, 5, 3);
    scene3D.add(pointLight);

    function toggleModal(id) {
      const m = document.getElementById(id);
      m.classList.toggle('hidden');
      m.classList.toggle('flex');
      if (id === 'history-modal') renderHistory();
    }

    function saveApiKey() {
      const key = document.getElementById('gemini-key-input').value.trim();
      if (key) {
        localStorage.setItem('GEMINI_API_KEY', key);
        toggleModal('api-modal');
        document.getElementById('status-bar').innerText = "Clé API enregistrée ✓";
      }
    }

    async function generateMasterStudio() {
      const topic = document.getElementById('topic-input').value.trim();
      const totalSeconds = parseInt(document.getElementById('duration-select').value);
      const style = document.getElementById('style-select').value;

      if (!topic) {
        alert("Entre ton sujet ou ton scénario !");
        return;
      }

      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) {
        toggleModal('api-modal');
        return;
      }

      document.getElementById('status-bar').innerText = "🧠 Analyse sémantique et génération des prompts 8K...";

      const prompt = `Tu es un réalisateur professionnel de films et de clips viraux générés par IA (style Sora, Runway).
Sujet de l'utilisateur : "${topic}"
Durée : ${totalSeconds}s
Style : "${style}"

Tu dois analyser précisément le sujet et structurer un pipeline de 4 scènes parfaitement fidèle au texte.
Pour chaque scène, fournis :
1. "time": minutage exact (ex: "0-15s")
2. "voiceover": texte de voix-off en français percutant, directement inspiré du sujet.
3. "video_prompt": prompt vidéo 8K détaillé en anglais pour Sora/Runway décrivant précisément l'action du sujet.
4. "theme_3d": type de scène 3D parmi ('football', 'mining', 'cyber', 'space', 'generic').

Génère UNIQUEMENT un objet JSON valide (sans markdown) avec cette structure :
{
  "hook": "Accroche choc basée sur le sujet",
  "scenes": [
    {"time": "0-15s", "voiceover": "...", "video_prompt": "...", "theme_3d": "football"},
    {"time": "15-30s", "voiceover": "...", "video_prompt": "...", "theme_3d": "football"},
    {"time": "30-45s", "voiceover": "...", "video_prompt": "...", "theme_3d": "football"},
    {"time": "45-60s", "voiceover": "...", "video_prompt": "...", "theme_3d": "football"}
  ]
}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleanJson = rawText.replace(/```json|```/g, '').trim();
        currentPipeline = { topic, totalSeconds, style, date: new Date().toLocaleDateString(), ...JSON.parse(cleanJson) };
        finishPipelineLoad();
      } catch (e) {
        console.warn("Quota atteint -> Activation de l'Analyseur Sémantique Local :", e);
        document.getElementById('status-bar').innerText = "⚡ Quota API atteint -> Analyseur Sémantique Local Actif !";
        currentPipeline = generateSemanticLocalPipeline(topic, totalSeconds, style);
        finishPipelineLoad();
      }
    }

    // Analyseur Sémantique Local Intelligent (Anti-Quota Ultra Précis)
    function generateSemanticLocalPipeline(topic, totalSeconds, style) {
      const lower = topic.toLowerCase();
      let theme = 'football';
      if (lower.includes('camion') || lower.includes('mine') || lower.includes('pelleteuse')) theme = 'mining';
      if (lower.includes('cyber') || lower.includes('futur')) theme = 'cyber';
      if (lower.includes('espace') || lower.includes('fusée')) theme = 'space';

      if (lower.includes('ronaldo') || lower.includes('foot') || lower.includes('but')) {
        return {
          topic, totalSeconds, style, date: new Date().toLocaleDateString(),
          hook: "Le jour où Cristiano Ronaldo a littéralement détruit les lois de la physique...",
          scenes: [
            { time: "0-15s", voiceover: "À 40 mètres du but, un coup franc d'une distance impossible...", video_prompt: "Cinematic low-angle shot of Cristiano Ronaldo standing over a soccer ball at night in a massive packed stadium, stadium floodlights, 8k resolution.", theme_3d: "football" },
            { time: "15-30s", voiceover: "Une puissance phénoménale... Le ballon se transforme en boule de feu !", video_prompt: "Dynamic camera tracking motion behind Ronaldo, ball instantly transforms into a blazing fiery meteor with orange flame trails, 8k.", theme_3d: "football" },
            { time: "30-45s", voiceover: "BOOM ! La frappe transperce les filets et choque tout le stade !", video_prompt: "High energy cinematic action, fiery meteor ball violently tearing through goal net, explosive volumetric smoke, 8k video.", theme_3d: "football" },
            { time: "45-60s", voiceover: "SIUUUU ! Cristiano s'enflamme, le stade est en délire ! Abonne-toi !", video_prompt: "Epic cinematic shot of Ronaldo performing iconic jump-spin SIUUU celebration, stadium fans cheering, 8k resolution.", theme_3d: "football" }
          ]
        };
      } else {
        return {
          topic, totalSeconds, style, date: new Date().toLocaleDateString(),
          hook: `Le projet ultime autour de : ${topic.substring(0, 40)}...`,
          scenes: [
            { time: "0-15s", voiceover: `Introduction spectaculaire : ${topic.substring(0, 30)}...`, video_prompt: `Cinematic 3D establishing shot of ${topic}, volumetric lighting, hyper-realistic 8k.`, theme_3d: theme },
            { time: "15-30s", voiceover: "Le rythme s'accélère avec une intensité dramatique saisissante.", video_prompt: `Dynamic camera movement showcasing core action of ${topic}, cinematic color grading, 8k.`, theme_3d: theme },
            { time: "30-45s", voiceover: "Le climax absolu ! L'action atteint son paroxysme.", video_prompt: `Climax action sequence for ${topic}, epic visual effects, dramatic lighting, 8k.`, theme_3d: theme },
            { time: "45-60s", voiceover: "Conclusion légendaire. Abonne-toi pour ne rien rater !", video_prompt: `Epic cinematic closing shot for ${topic}, masterpiece lighting, outro style, 8k.`, theme_3d: theme }
          ]
        };
      }
    }

    function finishPipelineLoad() {
      saveToHistory(currentPipeline);

      document.getElementById('hook-view').innerText = `"${currentPipeline.hook}"`;
      document.getElementById('scenes-pipeline-view').innerHTML = currentPipeline.scenes.map((s, idx) => `
        <div class="glass-panel rounded-xl p-3 space-y-2 border-slate-800">
          <div class="flex justify-between items-center">
            <span class="text-pink-400 font-bold text-xs">Scène ${idx + 1} (${s.time})</span>
            <button onclick="copyPrompt(${idx})" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-pink-300 px-2 py-1 rounded border border-slate-700">
              📋 Copier Prompt 8K
            </button>
          </div>
          <div>
            <span class="text-[10px] font-bold text-slate-400 uppercase block">Voix-Off :</span>
            <p class="text-xs text-slate-200">${s.voiceover}</p>
          </div>
          <div class="bg-black/50 p-2 rounded-lg border border-slate-800/80">
            <span class="text-[9px] font-bold text-amber-400 uppercase block mb-0.5">Prompt Vidéo (Anglais 8K) :</span>
            <p class="text-[11px] font-mono text-emerald-300 select-all">${s.video_prompt}</p>
          </div>
        </div>
      `).join('');

      document.getElementById('results-container').classList.remove('hidden');
      previewScene(0);
      document.getElementById('status-bar').innerText = "✅ Studio WebGL & Prompts synchronisés avec succès !";
    }

    function build3DScene(theme) {
      scene3D.children.forEach(child => {
        if (child !== ambientLight && child !== pointLight && child !== camera) {
          scene3D.remove(child);
        }
      });
      scene3D.background = new THREE.Color(theme === 'cyber' ? 0x030712 : 0x050814);
      scene3DObjects = [];

      if (theme === 'football') {
        const planeGeo = new THREE.PlaneGeometry(20, 20);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x047857, roughness: 0.8 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -1.5;
        scene3D.add(plane);

        const ballGeo = new THREE.SphereGeometry(0.9, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xef4444, roughness: 0.2 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(0, 0, 0);
        scene3D.add(ball);
        scene3DObjects.push(ball);

        for (let i = 0; i < 3; i++) {
          const ringGeo = new THREE.TorusGeometry(1.6 + i * 0.7, 0.04, 16, 100);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          scene3D.add(ring);
          scene3DObjects.push(ring);
        }
      } else if (theme === 'mining') {
        const gridGeo = new THREE.PlaneGeometry(20, 20, 10, 10);
        const gridMat = new THREE.MeshStandardMaterial({ color: 0x78350f, wireframe: true });
        const grid = new THREE.Mesh(gridGeo, gridMat);
        grid.rotation.x = -Math.PI / 2;
        grid.position.y = -1.5;
        scene3D.add(grid);

        const truckGeo = new THREE.BoxGeometry(2.5, 1.2, 4);
        const truckMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
        const truck = new THREE.Mesh(truckGeo, truckMat);
        truck.position.set(0, -0.5, 0);
        scene3D.add(truck);
        scene3DObjects.push(truck);
      } else {
        const geo = new THREE.IcosahedronGeometry(1.5, 0);
        const mat = new THREE.MeshStandardMaterial({ color: 0xec4899, wireframe: true });
        const mesh = new THREE.Mesh(geo, mat);
        scene3D.add(mesh);
        scene3DObjects.push(mesh);
      }
    }

    function previewScene(idx) {
      activeSceneIndex = idx;
      sceneStartTime = performance.now();
      const sceneData = currentPipeline.scenes[idx] || currentPipeline.scenes[0];
      build3DScene(sceneData.theme_3d || 'football');

      document.getElementById('scene-badge').innerText = `SCÈNE ${idx + 1}`;
      document.getElementById('subtitle-view').innerText = sceneData.voiceover;

      if (!animFrameId) {
        renderLoop();
      }
    }

    function renderLoop() {
      if (!currentPipeline) return;
      const now = performance.now();
      const totalSec = currentPipeline.totalSeconds || 60;
      const sceneDurationSec = totalSec / 4;
      const t = (now - sceneStartTime) / 1000;

      scene3DObjects.forEach((obj, index) => {
        if (index === 0) {
          obj.rotation.x += 0.01;
          obj.rotation.y += 0.02;
          obj.position.y = Math.sin(t * 3) * 0.5;
        } else {
          obj.rotation.z += 0.015 * (index % 2 === 0 ? 1 : -1);
          obj.rotation.x += 0.01;
        }
      });

      renderer.render(scene3D, camera);
      animFrameId = requestAnimationFrame(renderLoop);
    }

    async function startVideoRecording() {
      if (!currentPipeline) return;
      if (!window.MediaRecorder) {
        alert("Enregistrement non supporté sur ce navigateur.");
        return;
      }

      const btn = document.getElementById('record-btn');
      const statusEl = document.getElementById('render-progress');
      btn.disabled = true;
      btn.classList.add('opacity-50');
      statusEl.innerText = "🔴 Enregistrement 3D (.WEBM)...";

      const stream = canvas.captureStream(30);
      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      } catch (e) {
        recorder = new MediaRecorder(stream);
      }

      let chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `shortflow_master_${Date.now()}.webm`;
        a.click();
        statusEl.innerText = "✅ Vidéo 3D téléchargée avec succès !";
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      };

      const totalMs = (currentPipeline.totalSeconds || 60) * 1000;
      const sceneMs = totalMs / 4;

      activeSceneIndex = 0;
      sceneStartTime = performance.now();
      build3DScene(currentPipeline.scenes[0].theme_3d || 'football');
      recorder.start();

      function speakScene(idx) {
        if ('speechSynthesis' in window && currentPipeline.scenes[idx]) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(currentPipeline.scenes[idx].voiceover);
          utter.lang = 'fr-FR';
          utter.rate = 1.05;
          window.speechSynthesis.speak(utter);
        }
      }

      speakScene(0);

      let step = 0;
      const timer = setInterval(() => {
        step++;
        if (step < 4) {
          activeSceneIndex = step;
          sceneStartTime = performance.now();
          build3DScene(currentPipeline.scenes[step].theme_3d || 'football');
          document.getElementById('scene-badge').innerText = `SCÈNE ${step + 1}`;
          document.getElementById('subtitle-view').innerText = currentPipeline.scenes[step].voiceover;
          speakScene(step);
        } else {
          clearInterval(timer);
          setTimeout(() => { recorder.stop(); }, 1000);
        }
      }, sceneMs);
    }

    function copyPrompt(idx) {
      if (!currentPipeline || !currentPipeline.scenes[idx]) return;
      navigator.clipboard.writeText(currentPipeline.scenes[idx].video_prompt).then(() => {
        alert(`Prompt 8K de la Scène ${idx + 1} copié !`);
      });
    }

    function saveToHistory(proj) {
      let hist = JSON.parse(localStorage.getItem('SHORTFLOW_MASTER') || '[]');
      hist.unshift(proj);
      if (hist.length > 15) hist.pop();
      localStorage.setItem('SHORTFLOW_MASTER', JSON.stringify(hist));
    }

    function saveCurrentPipeline() {
      if (!currentPipeline) return;
      saveToHistory(currentPipeline);
      document.getElementById('status-bar').innerText = "💾 Projet sauvegardé ✓";
    }

    function exportPipelineJSON() {
      if (!currentPipeline) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentPipeline, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `shortflow_master_${Date.now()}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_MASTER') || '[]');
      if (hist.length === 0) {
        list.innerHTML = `<div class="text-slate-500 text-center py-4">Aucun projet sauvegardé.</div>`;
        return;
      }
      list.innerHTML = hist.map((item, idx) => `
        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
          <div class="truncate">
            <div class="text-white font-bold truncate">${item.topic}</div>
            <div class="text-[10px] text-slate-400">${item.totalSeconds}s • ${item.date}</div>
          </div>
          <button onclick="loadProj(${idx})" class="px-2.5 py-1 rounded bg-pink-600 text-white font-bold text-[10px] shrink-0">Ouvrir</button>
        </div>
      `).join('');
    }

    function loadProj(idx) {
      const hist = JSON.parse(localStorage.getItem('SHORTFLOW_MASTER') || '[]');
      if (hist[idx]) {
        currentPipeline = hist[idx];
        document.getElementById('topic-input').value = hist[idx].topic;
        finishPipelineLoad();
        toggleModal('history-modal');
      }
    }
  </script>
</body>
</html>
